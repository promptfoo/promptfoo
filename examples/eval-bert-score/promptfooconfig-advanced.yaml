# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Advanced BERTScore with multiple references

prompts:
  - 'Explain: {{topic}}'

providers:
  - openai:gpt-4.1-nano

defaultTest:
  options:
    # Keep all reference strings in one assertion instead of expanding the tests.
    disableVarExpansion: true

tests:
  - vars:
      topic: 'gradient descent'
      reference:
        - An optimization algorithm that adjusts parameters to minimize error
        - A method for finding the minimum of a function by moving in the direction of steepest descent
        - Like rolling a ball down a hill to find the lowest point
    assert:
      - type: python
        value: file://bertscore_check.py
        threshold: 0.75
