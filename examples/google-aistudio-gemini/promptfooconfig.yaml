# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Compare Gemini and Gemma on arithmetic

prompts:
  - '{{puzzle}} Reply with just the number.'

providers:
  - id: google:gemini-3.8-flash
    config:
      systemInstruction: file://system-instruction.txt
  - google:gemma-4-26b-a4b-it

tests:
  - vars:
      puzzle: A train travels at 60 mph for 2.5 hours, then at 40 mph for 1.5 hours. What is its average speed in mph?
    assert:
      - type: equals
        value: '52.5'
