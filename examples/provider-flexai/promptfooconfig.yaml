# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: FlexAI chat and embedding models

prompts:
  - 'Answer in one short sentence: {{question}}'

# Both models and the embedding grader run on a single `FLEXAI_API_KEY`.
providers:
  - id: openai:chat:DeepSeek-V4-Flash-0731
    label: 'DeepSeek V4 Flash'
    config:
      apiBaseUrl: https://api.flex.ai/v1
      apiKeyEnvar: FLEXAI_API_KEY
      headers:
        OpenAI-Organization: ''
      omitDefaults: true
      temperature: 0
      max_tokens: 4096
      showThinking: false
      passthrough:
        reasoning_effort: low
  - id: openai:chat:gpt-oss-120b
    label: 'gpt-oss-120b (low reasoning)'
    config:
      apiBaseUrl: https://api.flex.ai/v1
      apiKeyEnvar: FLEXAI_API_KEY
      headers:
        OpenAI-Organization: ''
      omitDefaults: true
      temperature: 0
      max_tokens: 4096
      showThinking: false
      passthrough:
        reasoning_effort: low

defaultTest:
  options:
    provider:
      embedding:
        id: openai:embedding:bge-m3
        config:
          apiBaseUrl: https://api.flex.ai/v1
          apiKeyEnvar: FLEXAI_API_KEY
          headers:
            OpenAI-Organization: ''

tests:
  - vars:
      question: What is the chemical symbol for gold?
    assert:
      - type: icontains
        value: Au
  - vars:
      question: Why does ice float on liquid water?
    assert:
      - type: icontains-any
        value: [dense, density]
      - type: similar
        value: Ice floats because it is less dense than liquid water.
        threshold: 0.6
