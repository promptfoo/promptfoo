# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Pi coding agent working directory with tools disabled'

prompts:
  - 'Name the function defined by this code in one sentence: {{source}}'

providers:
  - id: pi:openai/gpt-5.5
    config:
      # The working directory is this example folder, which ships with sample.py,
      # so the example is self-contained when initialized on its own.
      working_dir: .

tests:
  - vars:
      source: file://sample.py
    assert:
      - type: icontains
        value: 'greet'
