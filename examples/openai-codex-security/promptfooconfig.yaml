# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Compare Codex Security source reviews
prompts:
  - file://prompt.txt
providers:
  - id: openai:codex-security
    label: Luna medium
    config: &scan
      operation: security-scan
      model: gpt-5.6-luna
      model_reasoning_effort: medium
      auth: chatgpt
      repository: '{{env.CODEX_SECURITY_REPOSITORY}}'
      paths:
        - data/mongodb.ts
        - lib/insecurity.ts
        - models/user.ts
        - routes/basket.ts
        - routes/changePassword.ts
        - routes/delivery.ts
        - routes/fileServer.ts
        - routes/login.ts
        - routes/orderHistory.ts
        - routes/profileImageUrlUpload.ts
        - routes/redirect.ts
        - routes/search.ts
        - routes/updateProductReviews.ts
        - server.ts
      max_cost_usd: 5
      codex_overrides:
        approval_policy: never
        features:
          multi_agent_v2:
            max_concurrent_threads_per_session: 3
  - id: openai:codex-security
    label: Terra medium
    config:
      <<: *scan
      model: gpt-5.6-terra
defaultTest:
  assert:
    - type: javascript
      metric: CompletedScan
      value: file://grade-benchmark.mjs:completedScan
    - type: javascript
      metric: CompleteCoverage
      value: file://grade-benchmark.mjs:completeCoverage
tests:
  - description: Review the same pinned 14-file scope
    vars: {}
