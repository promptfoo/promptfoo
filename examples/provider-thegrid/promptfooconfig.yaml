# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: The Grid AI capability tiers via the OpenAI-compatible provider

prompts:
  - 'Answer concisely: {{question}}'

providers:
  # `apiKeyEnvar` names the only variable this provider reads, so a missing
  # THEGRID_API_KEY fails locally instead of falling back to OPENAI_API_KEY.
  # The empty OpenAI-Organization header keeps an ambient OPENAI_ORGANIZATION
  # from being sent to api.thegrid.ai.
  - id: openai:chat:text-standard
    label: The Grid AI text-standard
    config:
      apiBaseUrl: https://api.thegrid.ai/v1
      apiKeyEnvar: THEGRID_API_KEY
      headers:
        OpenAI-Organization: ''
      temperature: 0
      # Use max_tokens: promptfoo only forwards max_completion_tokens for models
      # it classifies as reasoning models, which Grid instrument names are not.
      max_tokens: 1024
      # Grade the final answer, not the reasoning trace.
      showThinking: false

  - id: openai:chat:text-prime
    label: The Grid AI text-prime
    config:
      apiBaseUrl: https://api.thegrid.ai/v1
      apiKeyEnvar: THEGRID_API_KEY
      headers:
        OpenAI-Organization: ''
      temperature: 0
      max_tokens: 1024
      showThinking: false

tests:
  # The point of this example is comparing capability tiers, so each case is a
  # task where a weaker tier plausibly differs from a stronger one, with an
  # assertion that stays deterministic. Trivia would grade the same on both and
  # demonstrate nothing.

  # Multi-step arithmetic with a distractor: the cheap failure is anchoring on
  # a number in the prompt instead of carrying the subtraction through.
  - vars:
      question: >-
        A warehouse holds 1,248 units. Monday ships 3 pallets of 96 units each,
        Tuesday receives a return of 45 units, and Wednesday ships 2 pallets of
        96. How many units remain? Reply with the number only.
    assert:
      - type: javascript
        value: output.trim().replace(/,/g, '') === '813'

  # Instruction following under a constraint that is easy to state and easy to
  # violate. Graded structurally rather than by a judge model: two sentences,
  # no banned words, both codes named, and each code's meaning present.
  - vars:
      question: >-
        Summarise why HTTP 429 differs from HTTP 503, in exactly two sentences.
        Do not use the words "rate" or "limit".
    assert:
      - type: javascript
        value: |
          const text = output.trim();
          const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
          const banned = /\b(rate|limit)/i.test(text);
          const codes = /\b429\b/.test(text) && /\b503\b/.test(text);
          const tooMany = /too many|requests? from (the|a|one) client|throttl/i.test(text);
          const unavailable = /unavailable|overload|maintenance|down\b|cannot handle|can't handle/i.test(text);
          return sentences.length === 2 && !banned && codes && tooMany && unavailable;

  # Structured output: the tiers differ most visibly on whether the shape holds
  # without commentary wrapped around it.
  - vars:
      question: >-
        Extract the order id, the total in USD, and the status from this line as
        JSON with keys id, total_usd, status, and nothing else:
        "Order A-4471 settled for $128.40 on 2026-03-02."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          const keys = Object.keys(parsed).sort().join(',');
          return (
            keys === 'id,status,total_usd' &&
            parsed.id === 'A-4471' &&
            Number(parsed.total_usd) === 128.4 &&
            String(parsed.status).toLowerCase() === 'settled'
          );
