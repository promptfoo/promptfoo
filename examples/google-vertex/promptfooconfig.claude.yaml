# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Review code with Claude on Vertex AI

prompts:
  - 'What happens if this Python function receives an empty list? {{code}}'

providers:
  - id: vertex:claude-sonnet-5-5
    config:
      region: global

tests:
  - vars:
      code: |
        def average(values):
            return sum(values) / len(values)
    assert:
      - type: icontains-any
        value:
          - ZeroDivisionError
          - division by zero
