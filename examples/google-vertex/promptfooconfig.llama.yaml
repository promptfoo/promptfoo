# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Identify an image with Llama on Vertex AI

prompts:
  - |
    [
      {
        "role": "user",
        "content": [
          { "type": "text", "text": "What animal is pictured here?" },
          { "type": "image_url", "image_url": { "url": "{{image}}" } }
        ]
      }
    ]

providers:
  - id: vertex:meta/llama-4-scout-17b-16e-instruct-maas
    config:
      region: us-east5

tests:
  - vars:
      image: file://assets/red-panda.jpg
    assert:
      - type: icontains
        value: red panda
