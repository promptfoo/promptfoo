# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Check Gemini tool arguments on Vertex AI

prompts:
  - 'Look up the weather at {{airport}} airport using its three-letter code.'

providers:
  - id: vertex:gemini-3.8-flash
    config:
      expressMode: false
      region: global
      tools:
        - functionDeclarations:
            - name: get_weather
              description: Look up the weather at an airport.
              parameters:
                type: OBJECT
                properties:
                  airport:
                    type: STRING
                    description: Three-letter IATA airport code.
                required: [airport]
      toolConfig:
        functionCallingConfig:
          mode: ANY

defaultTest:
  assert:
    - type: is-valid-function-call
    - type: equals
      transform: output.find?.((part) => part.functionCall)?.functionCall.args?.airport
      value: '{{airport}}'

tests:
  - vars:
      airport: SFO
  - vars:
      airport: LHR
