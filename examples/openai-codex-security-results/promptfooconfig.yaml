# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Synthetic Codex Security result presentation
prompts:
  - 'Display the synthetic {{scenario}} result. No security analysis is performed.'
providers:
  - id: file://provider.cjs
    label: SYNTHETIC security result replay
defaultTest:
  assert:
    - type: is-json
tests:
  - description: Synthetic complete coverage (expected pass)
    vars:
      scenario: complete
    assert:
      - type: javascript
        metric: CompleteCoverage
        value: JSON.parse(output).coverage.completeness === 'complete'
  - description: Synthetic partial coverage (expected assertion failure)
    vars:
      scenario: partial
    assert:
      - type: javascript
        metric: CompleteCoverage
        value: JSON.parse(output).coverage.completeness === 'complete'
  - description: Synthetic deferred validation (expected assertion failure)
    vars:
      scenario: deferred
    assert:
      - type: javascript
        metric: ReportableFinding
        value: JSON.parse(output).disposition === 'reportable'
  - description: Synthetic execution error (expected provider error)
    vars:
      scenario: error
