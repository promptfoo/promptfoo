# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Function Calling with OpenAI Responses API
prompts:
  - 'What is the weather like in {{location}}?'

providers:
  - id: openai:responses:gpt-6-astra
    label: gpt-6-astra
    config:
      reasoning:
        effort: low
      max_output_tokens: 4096
      tool_choice: auto
      tools:
        - type: function
          name: get_current_weather
          description: 'Get the current weather in a given location'
          parameters:
            type: object
            properties:
              location:
                type: string
                description: 'The city and state, e.g. San Francisco, CA'
              unit:
                type: string
                enum: ['celsius', 'fahrenheit']
            required: ['location', 'unit']

  - id: openai:responses:gpt-5.6-terra
    label: gpt-5.6-terra
    config:
      reasoning:
        effort: medium
      max_output_tokens: 4096
      tool_choice: auto
      tools:
        - type: function
          name: get_current_weather
          description: 'Get the current weather in a given location'
          parameters:
            type: object
            properties:
              location:
                type: string
                description: 'The city and state, e.g. San Francisco, CA'
              unit:
                type: string
                enum: ['celsius', 'fahrenheit']
            required: ['location', 'unit']

  - id: openai:responses:gpt-5.6-luna
    label: gpt-5.6-luna
    config:
      reasoning:
        effort: low
      max_output_tokens: 4096
      tool_choice: auto
      tools:
        - type: function
          name: get_current_weather
          description: 'Get the current weather in a given location'
          parameters:
            type: object
            properties:
              location:
                type: string
                description: 'The city and state, e.g. San Francisco, CA'
              unit:
                type: string
                enum: ['celsius', 'fahrenheit']
            required: ['location', 'unit']

tests:
  - vars:
      location: Boston, MA
    assert:
      - type: contains
        value: 'get_current_weather'

  - vars:
      location: San Francisco, CA
    assert:
      - type: contains
        value: 'get_current_weather'
