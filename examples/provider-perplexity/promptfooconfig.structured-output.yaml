# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Structured outputs with Perplexity (JSON Schema)

prompts:
  - 'Tell me about {{movie}}. Format your answer as a structured JSON object.'

providers:
  - id: perplexity:sonar
    config:
      temperature: 0.1
      max_tokens: 1000
      response_format:
        type: 'json_schema'
        json_schema:
          schema:
            type: 'object'
            properties:
              title: { type: 'string' }
              director: { type: 'string' }
              year: { type: 'integer' }
              genres: { type: 'array', items: { type: 'string' } }
              plot_summary: { type: 'string' }
            required: ['title', 'director', 'year', 'genres', 'plot_summary']
      # This provider will be used for the first prompt only

tests:
  - vars:
      movie: Inception
  - vars:
      movie: The Matrix
  - vars:
      movie: Parasite
