# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Synap chat models with rubric grading

prompts:
  - 'Answer in one short sentence: {{question}}'

# Both models and the rubric grader run on a single `SYNAP_API_KEY`.
providers:
  - id: openai:chat:qwen3-coder-30b
    label: 'qwen3-coder-30b (free tier)'
    config:
      apiBaseUrl: https://synap.linkrra.com/v1
      apiKeyEnvar: SYNAP_API_KEY
      headers:
        OpenAI-Organization: ''
      temperature: 0
      max_tokens: 512
  - id: openai:chat:gpt-oss-20b
    label: 'gpt-oss-20b'
    config:
      apiBaseUrl: https://synap.linkrra.com/v1
      apiKeyEnvar: SYNAP_API_KEY
      headers:
        OpenAI-Organization: ''
      temperature: 0
      max_tokens: 512
      showThinking: false

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-oss-20b
      config:
        apiBaseUrl: https://synap.linkrra.com/v1
        apiKeyEnvar: SYNAP_API_KEY
        headers:
          OpenAI-Organization: ''
        temperature: 0
        showThinking: false

tests:
  - vars:
      question: What is the chemical symbol for gold?
    assert:
      - type: regex
        value: \bAu\b
  - vars:
      question: Why does ice float on liquid water?
    assert:
      - type: icontains-any
        value: [less dense, lower density]
      - type: llm-rubric
        value: Explains that ice is less dense than liquid water.
