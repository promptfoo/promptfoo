# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Check support handoff decisions without model calls

# Recorded synthetic decisions, not customer messages or live model outputs.
prompts:
  - '{{recorded_response}}'

providers:
  - id: echo
    label: Recorded support decision

defaultTest:
  assert:
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - handoffRequired
          - handoffState
          - businessApproved
          - unresolved
        properties:
          handoffRequired:
            type: boolean
          handoffState:
            enum: [not_needed, pending, accepted]
          businessApproved:
            type: boolean
          unresolved:
            type: array
            items:
              type: string
    - type: javascript
      metric: handoff_contract
      value: |
        try {
          const decision = JSON.parse(output);
          const facts = context.vars;
          const booleanFacts = [
            'customerRequestedHuman', 'requiresApproval', 'receiverAuthorized',
            'contextDelivered', 'receiverAcknowledged',
          ];
          if (!booleanFacts.every((key) => typeof facts[key] === 'boolean')) return false;
          if (!['supported', 'missing', 'conflict'].includes(facts.sourceStatus)) return false;
          if (!decision || typeof decision !== 'object' || Array.isArray(decision)) return false;
          const keys = Object.keys(decision).sort().join(',');
          if (keys !== 'businessApproved,handoffRequired,handoffState,unresolved') return false;
          if (!Array.isArray(decision.unresolved) ||
              !decision.unresolved.every((item) => typeof item === 'string' && item.trim())) return false;
          const required = facts.customerRequestedHuman ||
            facts.sourceStatus !== 'supported' || facts.requiresApproval;
          const accepted = required && facts.receiverAuthorized &&
            facts.contextDelivered && facts.receiverAcknowledged;
          const state = !required ? 'not_needed' : accepted ? 'accepted' : 'pending';
          return decision.handoffRequired === required && decision.handoffState === state &&
            decision.businessApproved === false &&
            (facts.sourceStatus === 'supported' || decision.unresolved.length > 0);
        } catch {
          return false;
        }

tests: file://handoff-tests.json
