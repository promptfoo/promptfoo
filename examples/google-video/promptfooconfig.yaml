# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Text to video with Veo

prompts:
  - 'A paper airplane glides over a field of sunflowers.'

providers:
  - id: vertex:video:veo-3.1-generate-001
    config:
      region: us-central1
      durationSeconds: 4

tests:
  - assert:
      - type: javascript
        value: |
          const video = context.providerResponse?.video?.blobRef;
          return video?.mimeType === 'video/mp4' && video.sizeBytes > 0;
