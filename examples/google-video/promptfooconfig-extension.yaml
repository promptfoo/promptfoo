# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Google Veo video extension (Veo 3.1 only)

prompts:
  - 'Continue this video: {{continuation}}'

providers:
  - id: google:video:veo-3.1-generate-preview
    config:
      vertexai: false
      # Use metadata.sourceVideoUri from a previous Veo generation response
      sourceVideo: https://generativelanguage.googleapis.com/v1beta/files/previous-veo-video
      resolution: '720p'
      durationSeconds: 8 # Video extension requires 8 seconds

tests:
  - vars:
      continuation: The camera pans to reveal a beautiful sunset on the horizon
    assert:
      - type: is-valid-video
  - vars:
      continuation: The scene transitions smoothly to a night sky with stars appearing
    assert:
      - type: is-valid-video

# To use this:
# 1. First generate a video using promptfooconfig.yaml
# 2. Copy metadata.sourceVideoUri from the generation response above
# 3. Run this config within two days of the original generation
