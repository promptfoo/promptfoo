# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Google Veo video extension (Veo 3.1 only)

prompts:
  - 'Continue this video: {{continuation}}'

providers:
  - id: google:video:veo-3.1-generate-preview
    config:
      vertexai: false
      # Use metadata.sourceVideoUri from a previous Veo generation response
      sourceVideo: https://generativelanguage.googleapis.com/v1beta/files/previous-veo-video
      resolution: '720p'
      durationSeconds: 8 # Video extension requires 8 seconds

defaultTest:
  assert:
    - type: javascript
      value: |
        const video = context.providerResponse?.video?.blobRef;
        return video?.mimeType === 'video/mp4' && video.sizeBytes > 0;

tests:
  - vars:
      continuation: The camera pans to reveal a beautiful sunset on the horizon
  - vars:
      continuation: The scene transitions smoothly to a night sky with stars appearing

# To use this:
# 1. Generate a video and export the eval results with -o results.json.
# 2. Copy response.metadata.sourceVideoUri into sourceVideo above.
# 3. Set GOOGLE_API_KEY or GEMINI_API_KEY and run within two days of the source generation.
