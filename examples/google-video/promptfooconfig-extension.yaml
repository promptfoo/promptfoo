# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Extend a generated Veo clip

prompts:
  - 'Continue the camera movement toward the horizon.'

providers:
  - id: vertex:video:veo-3.1-generate-001
    config:
      region: us-central1
      sourceVideo: file://source.mp4

tests:
  - assert:
      - type: javascript
        value: |
          const video = context.providerResponse?.video?.blobRef;
          return video?.mimeType === 'video/mp4' && video.sizeBytes > 0;
