# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Animate a starting image with Veo

prompts:
  - 'The raccoon turns toward the camera.'

providers:
  - id: vertex:video:veo-3.1-generate-001
    config:
      region: us-central1
      image: file://assets/raccoon.jpg
      durationSeconds: 4

tests:
  - assert:
      - type: javascript
        value: |
          const video = context.providerResponse?.video?.blobRef;
          return video?.mimeType === 'video/mp4' && video.sizeBytes > 0;
