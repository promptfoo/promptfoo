# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Claude Managed Agents dynamic workflow

prompts:
  - >-
    Use a dynamic workflow with two independent agents to check these calculations:
    17 + 25 = 42; 9 * 8 = 72. Wait for both checks to finish, then reply with
    exactly VERIFIED if both are correct, or INCORRECT otherwise.

providers:
  - id: anthropic:managed-agents
    config:
      agent:
        name: Promptfoo calculation verifier
        model: claude-sonnet-5
        system: Use a workflow when asked, wait for its results, and return only the requested verdict.
        multiagent:
          type: multiagent_20261001
          subagents:
            type: disabled
          workflows:
            type: enabled
      environment:
        name: Promptfoo verification environment
        config:
          type: cloud
          networking:
            type: limited
            allowed_hosts: []
            allow_package_managers: false
      session:
        budget:
          type: limit
          max_list_cost:
            amount: '100'
            currency: USD
      timeoutMs: 300000

tests:
  - assert:
      - type: contains
        value: VERIFIED
      - type: not-contains
        value: INCORRECT
      - type: javascript
        value: >-
          context.providerResponse.metadata.workflowRuns.some(run =>
          run.status === 'ended' && run.result?.type === 'completed')
