# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: PopNow Provider Example

prompts:
  - |
    You are a helpful assistant. Answer the following question concisely:
    {{question}}

providers:
  - id: popnow:google/gemini-3.7-flash/chat
    label: 'Gemini 3.7 Flash via PopNow'
    config:
      temperature: 0.7
      max_tokens: 500
  - id: popnow:deepseek/v4.1-flash/chat
    label: 'DeepSeek V4.1 Flash via PopNow'
    config:
      temperature: 0.7
      max_tokens: 500

tests:
  - description: 'Basic knowledge test'
    vars:
      question: 'What is the capital of France?'
    assert:
      - type: contains
        value: 'Paris'

  - description: 'Technical explanation'
    vars:
      question: 'Explain machine learning in simple terms'
    assert:
      - type: icontains
        value: 'machine learning'
