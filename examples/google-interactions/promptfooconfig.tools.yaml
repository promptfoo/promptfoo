# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Function calling over the Gemini Interactions API

prompts:
  - 'What is the weather in {{city}}? Use the tool. Answer in one sentence.'

providers:
  # No callback: the pending function call is returned for assertions to inspect.
  - id: google:interactions:gemini-3.8-flash
    label: tool-call-only
    config:
      tools: file://tools.yaml

  # With a callback, promptfoo runs the tool and continues until the model answers.
  - id: google:interactions:gemini-3.8-flash
    label: tool-executed
    config:
      tools: file://tools.yaml
      functionToolCallbacks:
        get_weather: file://callbacks.js:get_weather

tests:
  - vars:
      city: Boston
    providers: [tool-call-only]
    assert:
      - type: is-valid-function-call
  - vars:
      city: Boston
    providers: [tool-executed]
    assert:
      - type: contains
        value: '52'
