# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Gemini Interactions API on Vertex AI

# This route uses OAuth and stored interactions. Pass history in the prompt;
# previousInteractionId is not supported by this adapter on Vertex.
# Check current Vertex model availability before running.
providers:
  - id: vertex:interactions:gemini-3-flash-preview
    config:
      region: global
      tools: file://tools.yaml
      functionToolCallbacks:
        get_weather: file://callbacks.js:get_weather

prompts:
  - 'What is the weather in {{city}}? Use the tool. Answer in one sentence.'

tests:
  - vars:
      city: Boston
    assert:
      - type: contains
        value: '52'
