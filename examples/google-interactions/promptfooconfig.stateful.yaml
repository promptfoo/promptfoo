# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Server-side interaction history (opt-in retention)

# AI Studio chat defaults to store:false. Enable storage to return an interaction ID.
providers:
  - id: google:interactions:gemini-3.6-flash
    config:
      store: true

prompts:
  - '{{message}}'

tests:
  - vars:
      message: 'Remember the secret word: FLAMINGO. Reply OK.'
    assert:
      - type: contains
        value: OK
      - type: javascript
        value: context.metadata.interactionStored === true
