# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Automatic fallback to generateContent for unsupported capabilities

# Preserve configuration through the existing generateContent mapping.
providers:
  # This setting uses the existing safety-settings mapping.
  - id: google:gemini-3.6-flash
    label: safety-settings-fallback
    config:
      safetySettings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_ONLY_HIGH

  # Explicit opt-out.
  - id: google:gemini-3.6-flash
    label: explicit-opt-out
    config:
      interactions: false

prompts:
  - 'Answer in one word: what is the capital of {{country}}?'

tests:
  - vars:
      country: Italy
    assert:
      - type: contains
        value: Rome
