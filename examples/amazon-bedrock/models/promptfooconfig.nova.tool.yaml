# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Bedrock Nova Tool Use Eval'

prompts:
  - 'Report the usual color of {{topic}} by calling color_json with both the name and color. This tool records your answer; it does not look up colors.'

providers:
  - id: bedrock:amazon.nova-micro-v1:0
    config:
      region: 'us-east-1'
      interfaceConfig:
        temperature: 0.7
        maxTokens: 256
      toolConfig:
        toolChoice:
          auto: {}
        tools:
          - toolSpec:
              name: color_json
              description: 'Records a known color. Supply both the thing name and its color.'
              inputSchema:
                json:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'The name of the thing'
                    color:
                      type: string
                      description: 'The color of the thing'
                  required:
                    - name
                    - color
  - id: bedrock:amazon.nova-lite-v1:0
    config:
      region: 'us-east-1'
      interfaceConfig:
        temperature: 0.7
        maxTokens: 256
      toolConfig:
        toolChoice:
          auto: {}
        tools:
          - toolSpec:
              name: color_json
              description: 'Records a known color. Supply both the thing name and its color.'
              inputSchema:
                json:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'The name of the thing'
                    color:
                      type: string
                      description: 'The color of the thing'
                  required:
                    - name
                    - color
  - id: bedrock:amazon.nova-pro-v1:0
    config:
      region: 'us-east-1'
      interfaceConfig:
        temperature: 0.7
        maxTokens: 256
      toolConfig:
        toolChoice:
          auto: {}
        tools:
          - toolSpec:
              name: color_json
              description: 'Records a known color. Supply both the thing name and its color.'
              inputSchema:
                json:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'The name of the thing'
                    color:
                      type: string
                      description: 'The color of the thing'
                  required:
                    - name
                    - color

defaultTest:
  assert:
    - type: javascript
      value: |
        try {
          const tool = JSON.parse(output);
          return tool.name === 'color_json' &&
            typeof tool.input?.name === 'string' &&
            tool.input.name.trim().toLowerCase() === context.vars.topic.toLowerCase() &&
            tool.input?.color?.toLowerCase() === context.vars.expectedColor;
        } catch {
          return false;
        }
tests:
  - vars:
      topic: sky
      expectedColor: blue
  - vars:
      topic: ocean
      expectedColor: blue
  - vars:
      topic: banana
      expectedColor: yellow
  - vars:
      topic: grass
      expectedColor: green
