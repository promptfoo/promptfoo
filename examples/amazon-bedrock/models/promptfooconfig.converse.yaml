# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Bedrock Converse API with Extended Thinking'

prompts:
  - 'Solve this step by step: {{problem}}'

providers:
  # Claude with adaptive thinking via Converse API. Claude 4.7+ and the Claude 5 family
  # reject the manual `budget_tokens` budget — `effort` is the depth control instead.
  - id: bedrock:converse:us.anthropic.claude-sonnet-5
    label: Claude Sonnet 5 (Converse + Thinking)
    config:
      region: us-west-2
      maxTokens: 20000
      thinking:
        type: adaptive
      # Converse has no typed `effort` option; it is passed through as a raw field.
      additionalModelRequestFields:
        output_config:
          effort: high
      showThinking: true

  # Claude Opus for comparison. Opus 5 also rejects temperature/top_p/top_k.
  - id: bedrock:converse:us.anthropic.claude-opus-5
    label: Claude Opus 5 (Converse)
    config:
      region: us-east-1
      maxTokens: 4096

  # Nova via Converse API
  - id: bedrock:converse:amazon.nova-pro-v1:0
    label: Nova Pro (Converse)
    config:
      region: us-east-1
      maxTokens: 4096

  # Llama via Converse API
  - id: bedrock:converse:us.meta.llama3-3-70b-instruct-v1:0
    label: Llama 3.3 70B (Converse)
    config:
      region: us-west-2
      maxTokens: 4096

tests:
  - vars:
      problem: 'What is the 100th prime number?'
  - vars:
      problem: 'Prove that the square root of 2 is irrational.'
  - vars:
      problem: 'A farmer has 17 sheep. All but 9 run away. How many are left?'
  - vars:
      problem: 'If it takes 5 machines 5 minutes to make 5 widgets, how long would it take 100 machines to make 100 widgets?'
  - vars:
      problem: 'Find all positive integers n such that n^2 + 1 is divisible by n + 1.'
