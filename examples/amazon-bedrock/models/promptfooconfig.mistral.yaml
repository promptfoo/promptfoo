# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Bedrock Mistral text models

prompts:
  - 'Write a post about {{topic}} in 280 characters or fewer. Include exactly one hashtag.'

providers:
  - id: bedrock:mistral.mistral-large-3-675b-instruct
    config:
      region: us-east-1
      max_tokens: 200
  - id: bedrock:us.mistral.pixtral-large-2502-v1:0
    config:
      region: us-west-2
      max_tokens: 200

tests:
  - vars:
      topic: A new public library
    assert:
      - type: javascript
        value: output.length <= 280 && (output.match(/#[\p{L}\p{N}_]+/gu) ?? []).length === 1
