# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Simple Inference Profile Example - Usage Tracking'

# This example demonstrates a typical production setup using inference profiles
# for usage tracking; cross-region routing depends on the profile source

prompts:
  - 'Answer this customer support question professionally: {{question}}'

providers:
  # Production profile for one model
  # Copy a system cross-region profile to enable routing among its regions
  - id: bedrock:converse:arn:aws:bedrock:us-east-1:YOUR_ACCOUNT_ID:application-inference-profile/prod-claude-ha
    label: 'Production Claude'
    config:
      region: 'us-east-1'
      maxTokens: 500

  # System inference profile for comparison
  - id: bedrock:us.anthropic.claude-sonnet-5
    label: 'Claude Sonnet 5 (US profile)'
    config:
      region: 'us-east-1'
      max_tokens: 500

tests:
  - vars:
      question: 'How do I reset my password?'
    assert:
      - type: contains
        value: 'password'
      - type: llm-rubric
        value: 'Response should be helpful, professional, and provide clear steps'

  - vars:
      question: "My order hasn't arrived yet, and it's been 2 weeks. What should I do?"
    assert:
      - type: llm-rubric
        value: 'Response should be empathetic and provide actionable next steps'

  - vars:
      question: 'Can I change my subscription plan mid-cycle?'
    assert:
      - type: llm-rubric
        value: 'Response should clearly explain the policy and any potential charges'

# Use an inference profile for consistent grading across regions
defaultTest:
  options:
    provider:
      id: bedrock:converse:arn:aws:bedrock:us-east-1:YOUR_ACCOUNT_ID:application-inference-profile/grading-claude
      config:
        maxTokens: 256
  assert:
    - type: not-contains
      value: 'I cannot'
    - type: javascript
      value: output.length >= 50
