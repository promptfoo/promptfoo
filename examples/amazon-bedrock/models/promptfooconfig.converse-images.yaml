# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Bedrock Converse API - Image/Multimodal'

prompts:
  # Converse API native format for images
  - file://converse_image_prompt.json

providers:
  - id: bedrock:converse:qwen.qwen3-vl-235b-a22b
    config:
      region: us-east-1
      maxTokens: 256

tests:
  - vars:
      image: file://cat.jpg
    assert:
      - type: javascript
        value: /\b(cats?|kittens?|felines?)\b/i.test(output)
