# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Bedrock Claude Eval'
prompts:
  - 'Write a tweet about {{topic}}'
providers:
  # Inference-profile ARN form. Only profiles that actually exist are usable here:
  # Claude exposes `global.` profiles for Opus 4.7/4.8/5, Sonnet 5, and Fable/Mythos 5 —
  # there is no `global.anthropic.claude-opus-4-6` profile.
  - id: bedrock:arn:aws:bedrock:us-east-2::inference-profile/global.anthropic.claude-opus-4-7
    label: Claude Opus 4.7 (global profile ARN)
    config:
      max_tokens: 2048
      region: us-east-2
      inferenceModelType: claude
  - id: bedrock:us.anthropic.claude-opus-4-1-20250805-v1:0
    label: Claude Opus 4.1
    config:
      temperature: 1
      max_tokens: 2048
      region: us-west-2
  # Opus 5 and 4.8 reject temperature/top_p/top_k at the model level; promptfoo omits
  # them for you, so they are left unset here. Use the `global.` profile for dynamic
  # routing — regional profiles (`us.`/`eu.`) add the 10% Claude 4.5+ premium.
  - id: bedrock:global.anthropic.claude-opus-5
    label: Claude Opus 5
    config:
      max_tokens: 2048
      region: us-east-2
  - id: bedrock:us.anthropic.claude-opus-4-8
    label: Claude Opus 4.8
    config:
      max_tokens: 2048
      region: us-west-2
  - id: bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0
    label: Claude Haiku 4.5
    config:
      temperature: 1
      max_tokens: 2048
      region: us-west-2
  # Adaptive thinking replaces the manual `budget_tokens` budget, which Claude 4.7+ and
  # the Claude 5 family reject. Bedrock's InvokeModel path exposes no `effort` field, so
  # the model uses its default reasoning depth; use `bedrock:converse:` to set effort.
  - id: bedrock:us.anthropic.claude-sonnet-5
    label: Claude Sonnet 5 with Thinking
    config:
      max_tokens: 2048
      region: us-west-2
      showThinking: true
      thinking:
        type: adaptive
  - id: bedrock:us.anthropic.claude-opus-4-6-v1
    label: Claude Opus 4.6 (inference profile)
    config:
      temperature: 1
      max_tokens: 2048
      region: us-west-2
tests:
  - vars:
      topic: Our eco-friendly packaging
  - vars:
      topic: A sneak peek at our secret menu item
  - vars:
      topic: Behind-the-scenes at our latest photoshoot
  - vars:
      topic: the impact of autonomous drones on wildlife conservation
  - vars:
      topic: the emerging trend of virtual reality courtrooms
  - vars:
      topic: the ethical implications of AI-generated art
  - vars:
      topic: the unexpected health benefits of daily meditation
  - vars:
      topic: how AI is changing the way we play board games
  - vars:
      topic: unconventional productivity hacks involving household items
  - vars:
      topic: An underground art exhibition in an abandoned subway station
  - vars:
      topic: A webinar on the impact of AI on traditional marketing strategies
  - vars:
      topic: The launch of a new eco-friendly sneaker made from ocean plastic
  - vars:
      topic: the correlation between social media usage and self-esteem in teenagers
  - vars:
      topic: the impact of urban noise pollution on migratory bird patterns
  - vars:
      topic: the role of gut microbiota in moderating anxiety and depression
