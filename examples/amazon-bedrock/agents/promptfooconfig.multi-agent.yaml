# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Invokes existing agents independently. Configure supervisor collaboration in AWS.
description: Bedrock Agents Classic support evaluation

prompts:
  - '{{query}}'

providers:
  - id: bedrock-agent:TECH_AGENT_ID
    label: tech-agent
    config:
      agentAliasId: TECH_ALIAS_ID
      region: us-east-1
      enableTrace: true
  - id: bedrock-agent:BILLING_AGENT_ID
    label: billing-agent
    config:
      agentAliasId: BILLING_ALIAS_ID
      region: us-east-1
      enableTrace: true
  - id: bedrock-agent:PRODUCT_AGENT_ID
    label: product-agent
    config:
      agentAliasId: PRODUCT_ALIAS_ID
      region: us-east-1
      enableTrace: true
  - id: bedrock-agent:SUPERVISOR_AGENT_ID
    label: supervisor-agent
    config:
      agentAliasId: SUPERVISOR_ALIAS_ID
      region: us-east-1
      enableTrace: true

defaultTest:
  assert:
    - type: regex
      value: '\S'

tests:
  - description: Technical agent handles uploads
    vars:
      query: My application crashes when uploading files larger than 10MB. How can I fix this?
    providers: [tech-agent]
    assert:
      - type: icontains-any
        value: [file size, upload, configuration]
  - description: Billing agent handles duplicate charges
    vars:
      query: I was charged twice for my subscription last month. How can I get a refund?
    providers: [billing-agent]
    assert:
      - type: icontains-any
        value: [refund, duplicate, charge]
  - description: Product agent addresses throughput
    vars:
      query: I need real-time data processing for 100,000 events per second. What do you recommend?
    providers: [product-agent]
    assert:
      - type: icontains-any
        value: [stream, kafka, kinesis, throughput, real-time]
  - description: Technical and billing agents address a plan upgrade
    vars:
      query: I upgraded my plan but still see old limits and 403 errors. What should I check?
    providers: [tech-agent, billing-agent]
    assert:
      # Each output is graded separately; there is no cross-provider outputs object.
      - type: icontains-any
        value: ['403', permission, authorization, payment, plan, upgrade]
  - description: Supervisor handles escalation
    vars:
      query: This is my third contact about the same issue. Please escalate to a manager.
    providers: [supervisor-agent]
    assert:
      - type: icontains-any
        value: [escalate, manager, supervisor, priority]

evaluateOptions:
  maxConcurrency: 2
