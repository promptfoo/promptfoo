# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Bedrock Agents Classic session evaluation

prompts:
  - '{{query}}'

providers:
  - id: bedrock-agent:YOUR_AGENT_ID
    config:
      agentAliasId: YOUR_ALIAS_ID
      region: us-east-1
      # Use a fresh ID for each run. All tests below form one ordered conversation.
      sessionId: promptfoo-session-change-me
      enableTrace: true
      # Optional: enable memory on the deployed agent first, then use a user ID.
      # memoryId: customer-123

evaluateOptions:
  maxConcurrency: 1
  cache: false

defaultTest:
  assert:
    - type: regex
      value: '\S'

tests:
  - vars:
      query: Tell me about your capabilities.
  - vars:
      query: Calculate the sum of 100 and 250.
    assert:
      - type: contains
        value: '350'
  - vars:
      query: Remember that my favorite color is blue.
  - vars:
      query: What is my favorite color?
    assert:
      - type: icontains
        value: blue
