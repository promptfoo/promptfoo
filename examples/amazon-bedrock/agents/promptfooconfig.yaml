# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Bedrock Agents Classic session evaluation

prompts:
  - '{{query}}'

providers:
  - id: bedrock-agent:YOUR_AGENT_ID
    config:
      agentAliasId: YOUR_ALIAS_ID
      region: us-east-1
      # Set this once per run (see README) so all four turns share a session.
      sessionId: '{{env.BEDROCK_SESSION_ID}}'

evaluateOptions:
  maxConcurrency: 1
  cache: false

defaultTest:
  assert:
    - type: regex
      value: '\S'

tests:
  - vars:
      query: Tell me about your capabilities.
  - vars:
      query: Calculate the sum of 100 and 250.
    assert:
      - type: contains
        value: '350'
  - vars:
      query: Remember that my favorite color is blue.
  - vars:
      query: What is my favorite color?
    assert:
      - type: icontains
        value: blue
