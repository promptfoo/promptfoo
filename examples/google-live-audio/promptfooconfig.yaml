# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Grade a spoken answer and its transcript

prompts:
  - file://prompt.yaml

providers:
  - google:live:gemini-3.8-live

tests:
  - vars:
      question: 'Which planet is called the Red Planet?'
    assert:
      - type: javascript
        value: Boolean(context.providerResponse.audio?.data)
      - type: icontains
        value: Mars
        transform: output.text
