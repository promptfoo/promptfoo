# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: AbliteratedLLM abliterated and stock models

prompts:
  - 'Answer in one short sentence: {{question}}'

# Both models run on a single `ABLITERATEDLLM_API_KEY`.
providers:
  - id: openai:chat:glm-5.3-flash-abliterated
    label: 'GLM-5.3 Flash Abliterated'
    config:
      apiBaseUrl: https://api.abliteratedllm.dev/v1
      apiKeyEnvar: ABLITERATEDLLM_API_KEY
      headers:
        OpenAI-Organization: ''
      omitDefaults: true
      max_tokens: 2048
      showThinking: false
      passthrough:
        reasoning_effort: low
  - id: openai:chat:glm-5.3-flash
    label: 'GLM-5.3 Flash (stock)'
    config:
      apiBaseUrl: https://api.abliteratedllm.dev/v1
      apiKeyEnvar: ABLITERATEDLLM_API_KEY
      headers:
        OpenAI-Organization: ''
      omitDefaults: true
      max_tokens: 2048
      showThinking: false
      passthrough:
        reasoning_effort: low

tests:
  - vars:
      question: What is the chemical symbol for gold?
    assert:
      - type: icontains
        value: Au
  - vars:
      question: Why does ice float on liquid water?
    assert:
      - type: icontains-any
        value: [dense, density]
