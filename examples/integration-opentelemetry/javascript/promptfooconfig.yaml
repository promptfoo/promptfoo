# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: OpenTelemetry tracing with trace-based assertions

prompts:
  - 'Explain how {{topic}} works in simple terms'

providers:
  - file://provider-simple-traced.js

defaultTest:
  assert:
    - type: javascript
      value: file://trace-assertions.js

    - type: trace-span-count
      value:
        pattern: 'rag_agent_workflow'
        min: 1
        max: 1

    - type: trace-span-count
      value:
        pattern: 'retrieve_document_*'
        min: 3
        max: 3

    - type: trace-span-count
      value:
        pattern: 'reasoning_*'
        min: 3

    # Parent spans include their children's time, so give the workflow its own limit.
    - type: trace-span-duration
      value:
        pattern: 'rag_agent_workflow'
        max: 5000

    - type: trace-span-duration
      value:
        pattern: 'retrieve_document_*'
        max: 300

    - type: trace-error-spans
      value:
        max_count: 0

tests:
  - vars:
      topic: 'quantum computing'
    metadata:
      tracingEnabled: true
      testCaseId: 'test-case-1'

  - vars:
      topic: 'machine learning'
    metadata:
      tracingEnabled: true
      testCaseId: 'test-case-2'

tracing:
  enabled: true
  otlp:
    http:
      enabled: true
      port: 4318
      acceptFormats: ['json']
