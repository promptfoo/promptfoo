# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Grade and classify support replies with Decisions

# Fixed outputs keep this example focused on grading and classification.
prompts:
  - '{{reply}}'

providers:
  - echo

defaultTest:
  options:
    provider: openai:decisions:gpt-6-luna

tests:
  - description: Apologizes and fixes the problem
    vars:
      reply: I'm sorry your order arrived damaged. A replacement ships today at no cost to you.
    assert:
      - type: llm-rubric
        value: The reply apologizes to the customer
      - type: llm-rubric
        value: How well does the reply resolve the customer's problem?
        provider:
          id: openai:decisions:gpt-6-luna
          config:
            threshold: 0.75
            levels:
              - Ignores the customer's problem
              - Acknowledges the problem but offers no fix
              - Acknowledges the problem and offers a concrete fix
      - type: classifier
        value: resolution
        threshold: 0.8
        provider:
          id: openai:decisions:gpt-6-luna
          config:
            instructions: What is this support reply doing?
            labels:
              resolution: Resolves the issue or offers a concrete fix
              deflection: Redirects the customer without helping
              question: Asks the customer for more information

  - description: Deflects without helping
    vars:
      reply: We cannot help with your damaged order and will not take any action. Please read the shipping policy on our website instead.
    assert:
      - type: not-llm-rubric
        value: The reply offers a replacement or a refund
      - type: classifier
        value: deflection
        threshold: 0.8
        provider:
          id: openai:decisions:gpt-6-luna
          config:
            instructions: What is this support reply doing?
            labels:
              resolution: Resolves the issue or offers a concrete fix
              deflection: Redirects the customer without helping
              question: Asks the customer for more information
