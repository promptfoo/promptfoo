# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Claude Sonnet 5.5 with adaptive thinking vs. between_tools

prompts:
  - |
    {{task}}

providers:
  # Adaptive thinking is on by default on Sonnet 5.5, so this entry sets no `thinking`
  # block. `effort` defaults to `high`; it is set here so the comparison is explicit.
  - id: anthropic:messages:claude-sonnet-5-5
    label: sonnet-5.5-adaptive-high
    config:
      effort: high
      max_tokens: 8000

  # `between_tools` is Sonnet 5.5's lowest thinking setting: no up-front thinking. It
  # replaces `thinking: { type: disabled }`, which Sonnet 5.5 rejects, and the API only
  # accepts it at effort `high` or below.
  - id: anthropic:messages:claude-sonnet-5-5
    label: sonnet-5.5-between-tools-medium
    config:
      effort: medium
      thinking:
        type: between_tools
      max_tokens: 8000

tests:
  # Multi-system bug diagnosis (intermittent failure)
  - vars:
      task: |
        You're debugging a production issue where users can't log in. Here's what you know:

        1. The frontend shows "Authentication failed" after username/password submission
        2. Backend logs show successful JWT generation
        3. Redis cache is returning stale session data
        4. Database shows correct user credentials
        5. The issue only affects 10% of login attempts
        6. It started after deploying a load balancer configuration change

        Diagnose the root cause and propose a fix. Explain your reasoning about what's
        causing the intermittent nature of the bug.
    assert:
      - type: contains-any
        value: ['load balancer', 'session', 'sticky', 'affinity', 'routing']
        reason: Should identify load balancer session routing as the issue
      - type: llm-rubric
        value: |
          The response should:
          1. Identify the root cause (likely session affinity/sticky sessions issue with the load balancer)
          2. Explain why it's intermittent (requests hit different backends with inconsistent session state)
          3. Propose concrete fixes (sticky sessions, a shared session store, or stateless tokens)

  # Code generation with error handling and caching
  - vars:
      task: |
        Write a Python function that fetches a user from a REST API (which may time out),
        caches the result in Redis for 5 minutes, and falls back to the database on a
        cache miss. Include type hints and error handling.
    assert:
      - type: contains
        value: 'def'
        reason: Should include a Python function definition
      - type: contains-any
        value: ['try', 'except', 'raise']
        reason: Should include error handling
      - type: llm-rubric
        value: |
          The code should implement the cache-aside pattern, handle API timeouts and errors
          gracefully, and include type hints.
