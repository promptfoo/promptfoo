# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Anthropic memory tool'

prompts:
  - '{{task}}'

providers:
  - id: anthropic:messages:claude-sonnet-5
    config:
      max_tokens: 2048
      tools:
        # Promptfoo returns the requested operation without executing a memory handler.
        - type: memory_20250818
          name: memory
          allowed_callers:
            - direct
      tool_choice:
        type: auto

tests:
  - vars:
      task: 'Check your memory directory for anything you already know about this user before answering: what are their formatting preferences?'
    assert:
      - type: contains
        value: '"name":"memory"'
      - type: contains
        value: 'tool_use'
      - type: contains
        value: '"command":"view"'
