# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Anthropic memory tool'

prompts:
  - '{{task}}'

providers:
  - id: anthropic:messages:claude-sonnet-5
    config:
      max_tokens: 2048
      tools:
        # Promptfoo passes Anthropic's native memory tool definition through
        # unchanged. It does not manage memory stores or run a local memory
        # handler — the point of this example is to observe whether the model
        # asks for a memory operation.
        - type: memory_20250818
          name: memory
          allowed_callers:
            - direct
      tool_choice:
        type: auto

tests:
  - vars:
      task: 'Check your memory directory for anything you already know about this user before answering: what are their formatting preferences?'
    assert:
      - type: contains
        value: '"name":"memory"'
      - type: contains
        value: 'tool_use'
