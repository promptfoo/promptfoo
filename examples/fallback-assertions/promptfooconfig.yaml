# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Fast checks with model-graded fallbacks

prompts:
  - 'Answer the following question concisely: {{question}}'

providers:
  - openai:gpt-6-sol

tests:
  - vars:
      question: 'What is the capital of France?'
    assert:
      - type: javascript
        value: |
          const validAnswers = ['Paris', 'paris'];
          return validAnswers.includes(output.trim());
        fallback: next

      - type: llm-rubric
        provider: openai:gpt-6-sol
        value: 'The response correctly identifies Paris as the capital of France'

  - vars:
      question: 'Explain photosynthesis'
    assert:
      - type: contains
        value: 'sunlight'
        fallback: next

      - type: regex
        value: '(sun|light|photo)'
        fallback: next

      - type: llm-rubric
        provider: openai:gpt-6-sol
        value: |
          The response demonstrates understanding of photosynthesis,
          mentioning key concepts like light energy, plants, and glucose production.

  - vars:
      question: 'What is 2+2?'
    assert:
      - type: contains
        value: '4'

      - type: javascript
        value: |
          /\b4\b/.test(output)
        fallback: next

      - type: llm-rubric
        provider: openai:gpt-6-sol
        value: 'The response correctly states that 2+2=4'

      - type: not-contains
        value: '5'
