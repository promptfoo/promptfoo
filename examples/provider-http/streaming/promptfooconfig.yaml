# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: HTTP provider streaming with TTFT measurement

# Reasoning is disabled to measure text delivery without a reasoning phase.

prompts:
  - 'Write a haiku about {{topic}}'
  - 'Explain {{topic}} in one sentence'

providers:
  - id: https://api.openai.com/v1/chat/completions
    config:
      method: 'POST'
      headers:
        'Content-Type': 'application/json'
        'Authorization': 'Bearer {{env.OPENAI_API_KEY}}'
      body:
        model: 'gpt-5.4-mini'
        reasoning_effort: 'none'
        messages:
          - role: 'user'
            content: '{{prompt}}'
        stream: true # Enable streaming for TTFT measurement
      # Measure first text output. Omit to measure the first response byte.
      streamFormat: openai-chat
      transformResponse: |
        (json, text) => {
          const message = json?.choices?.[0]?.message;
          if (message?.content || message?.refusal) {
            return message.content || message.refusal;
          }

          let content = '';
          for (const line of String(text || '').split('\n')) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data: ')) continue;
            if (trimmed === 'data: [DONE]') break;

            try {
              const data = JSON.parse(trimmed.slice(6));
              const delta = data.choices?.[0]?.delta;
              content += delta?.content || delta?.refusal || '';
            } catch {
              // Skip malformed JSON
            }
          }
          return content.trim();
        }

defaultTest:
  assert:
    - type: javascript
      value: 'output && output.length > 10'

    - type: ttft
      threshold: 3000

    - type: latency
      threshold: 10000

tests:
  - vars:
      topic: 'mountains'
  - vars:
      topic: 'artificial intelligence'
  - vars:
      topic: 'ocean waves'
