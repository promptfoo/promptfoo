# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Explicit application interruption of cafe announcement
prompts:
  - |
    Answer calls for a fictional cafe using only these facts.
    When asked for the announcement, read the supplied paragraph at a normal pace.
    If the caller asks a new question, stop the announcement and answer briefly.
    If the caller only acknowledges you, continue from your place without restarting.
    Do not invent facts or delegate backend work.
    {{authoritativeFacts}}

    ANNOUNCEMENT:
    Welcome to the cafe. On Saturdays we open at eight in the morning and close
    at four in the afternoon. Our drinks menu includes espresso, americano,
    latte, cappuccino, flat white, mocha, hot chocolate, tea, iced coffee, and
    cold brew. Our food menu includes muffins, croissants, and banana bread.
    You can order at the counter and pay by card or cash. There are tables
    inside and outside, and drinking water is available at the counter.
providers:
  - id: promptfoo:simulated-voice-user
    label: Application barge-in (not native yielding)
    config:
      durationMs: 35000
      targetPlayback:
        mode: app-barge-in
        transcriptionDelay: minimal
      callerInterventions:
        - atMs: 12000
          text: Wait a second, when does decaf end on Saturday?
      target:
        maxRetries: 0
        audio:
          output:
            voice: marin
      caller:
        maxRetries: 0
        audio:
          output:
            voice: cedar
defaultTest: file://grading.yaml
tests:
  - description: Wait a second, then hear the decaf answer
    vars:
      authoritativeFacts: |
        F1: On Saturdays the cafe opens at 8 am and closes at 4 pm.
        F2: Decaf is available until 3 pm on Saturdays.
        F3: The drinks menu contains espresso, americano, latte, cappuccino,
        flat white, mocha, hot chocolate, tea, iced coffee, and cold brew.
        F4: The food menu contains muffins, croissants, and banana bread.
        F5: Customers order at the counter and can pay by card or cash.
        F6: There are tables inside and outside, and drinking water at the counter.
        No flavors, varieties, prices, or other facts are provided.
      requiredGoals: |
        G1: After the caller asks the question, the caller hears that Saturday
        decaf is available until 3 pm.
        G2: The target does not continue or restart the announcement after answering.
        Playback timing and whether an interruption was exercised require the
        separate application evidence and recording review.
      expectedApplicationStops: 1
      instructions: |
        You are a cafe customer, not an assistant. Immediately ask, "Please read
        the complete cafe announcement." Then listen quietly. A scheduled recording
        will ask the decaf question. Do not ask it yourself or add acknowledgments.
        After hearing the decaf answer, thank them and say goodbye. Do not delegate.
    assert:
      - type: javascript
        value: file://app-playback-health.js
        metric: application_playback
      - type: javascript
        value: file://playout-health.js
        metric: voice_playout
      - type: javascript
        value: file://intervention-timing.js
        metric: intervention_timing
        config:
          maxDispatchDelayMs: 50
      - type: javascript
        metric: final_usage
        value: |
          const participants = context.providerResponse.metadata.voice.participants;
          return Object.values(participants).every(p => p.finalUsageConfirmed && p.heard.trim());
