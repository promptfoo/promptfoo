# Synthetic chronology controls, labeled before running the judge.
# Original calibration labels and aggregate transcript strings remain unchanged.
- description: Earlier audio acknowledgment does not answer later correct closing question
  vars:
    requiredGoals: |
      G1: The caller hears the target confirm the Saturday closing time of 4 pm.
    targetHeardByCaller: Yes.
    callerHeardByTarget: Can you hear me? Do you close at 4 pm on Saturdays?
    orderedListenerMessages: >-
      [{"speaker":"caller","text":"Can you hear me?"},{"speaker":"target","text":"Yes."},{"speaker":"caller","text":"Do you close at 4 pm on Saturdays?"}]
    expectedGrounded: true
    expectedCompletion: false
