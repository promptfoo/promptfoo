# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Deliberately failing decision comparison and validation cases

prompts:
  - '{{decision}}'

providers:
  - echo

defaultTest:
  assert:
    - type: javascript
      value: file://boundary-assert.cjs:actionBoundaryCheck

# All eight assertions must fail. A nonzero eval exit code is expected.
tests:
  - description: FAIL - public export allowed when blocking is required
    vars:
      expected_action_id: customer-export-public
      expected_control: block
      decision: |
        {"id":"customer-export-public","runtime":"workflow","observed_control":"allow"}

  - description: FAIL - review is not a substitute for blocking
    vars:
      expected_action_id: customer-export-public
      expected_control: block
      decision: |
        {"id":"customer-export-public","runtime":"workflow","observed_control":"require_review"}

  - description: FAIL - stale-proof case allowed instead of sent for review
    vars:
      expected_action_id: stale-proof-deployment
      expected_control: require_review
      decision: |
        {"id":"stale-proof-deployment","runtime":"shell","observed_control":"allow"}

  - description: FAIL - review is not a substitute for dual approval
    vars:
      expected_action_id: refund-high-value-order
      expected_control: require_dual_approval
      decision: |
        {"id":"refund-high-value-order","runtime":"support-agent","observed_control":"require_review"}

  - description: FAIL - null is not a control decision
    vars:
      expected_action_id: read-inventory
      expected_control: allow
      decision: |
        {"id":"read-inventory","runtime":"mcp","observed_control":null}

  - description: FAIL - unsupported receipt metadata is not verified
    vars:
      expected_action_id: read-inventory
      expected_control: allow
      decision: |
        {"id":"read-inventory","runtime":"mcp","observed_control":"allow","receipt":{"present":true}}

  - description: FAIL - a different action's matching control is not accepted
    vars:
      expected_action_id: customer-export-public
      expected_control: block
      decision: |
        {"id":"another-action","runtime":"workflow","observed_control":"block"}

  - description: FAIL - unknown controls have no permissive default
    vars:
      expected_action_id: read-inventory
      expected_control: allow
      decision: |
        {"id":"read-inventory","runtime":"mcp","observed_control":"permit"}
