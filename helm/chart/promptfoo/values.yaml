# Default values for promptfoo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Keep at 1: the server uses a local SQLite database and an in-memory job queue.
replicaCount: 1

image:
  repository: ghcr.io/promptfoo/promptfoo
  # Leave empty to follow the tag: Always for `latest`, IfNotPresent for any other tag.
  pullPolicy: ''
  # Set a release tag such as 0.124.1 (no `v` prefix) to pin a version.
  # Falls back to the chart appVersion when empty.
  tag: latest

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

# The image runs as uid 100, gid 101. fsGroup lets that user write to the data volume.
# These maps merge with your values, so set a key to null to remove it.
podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: promptfoo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: promptfoo-tls
  #   hosts:
  #     - promptfoo.example.com

# Environment variables as name/value or name/valueFrom entries.
# PROMPTFOO_REMOTE_API_BASE_URL and PROMPTFOO_REMOTE_APP_BASE_URL are set to
# http://localhost:3000 unless an entry here uses the same name.
env: []
# - name: OPENAI_API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: promptfoo-secrets
#       key: OPENAI_API_KEY

# Sources of environment variables, as secretRef or configMapRef entries.
envFrom: []
# - secretRef:
#     name: promptfoo-secrets

# The server uses about 256Mi of memory when idle and more while starting or running evals.
resources: {}
# requests:
#   cpu: 250m
#   memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# The claim and its data are kept when the release is uninstalled.
# `kubectl delete pvc <name>` removes them.
persistentVolumesClaims:
  - name: promptfoo
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    # Leave empty to use the cluster's default StorageClass. An existing claim keeps its class.
    storageClassName: ''

# Additional volumes on the output Deployment definition.
volumes:
  - name: config
    persistentVolumeClaim:
      claimName: promptfoo

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: config
    mountPath: '/home/promptfoo/.promptfoo'
    readOnly: false

nodeSelector: {}

tolerations: []

affinity: {}
