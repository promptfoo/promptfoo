{{- range .Values.persistentVolumesClaims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  labels:
    app: {{ $.Release.Name | quote }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  {{- /*
  The storage class of an existing claim cannot be changed or removed. Keep it when it was
  set explicitly (a field manager owns it) rather than assigned by the cluster default.
  */}}
  {{- $existing := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace .name }}
  {{- $explicit := contains "f:storageClassName" (toJson (dig "metadata" "managedFields" (list) $existing)) }}
  {{- with .storageClassName | default (ternary (dig "spec" "storageClassName" "" $existing) "" $explicit) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
