name: Python BERTScore Example

on:
  pull_request:
    paths:
      - 'examples/eval-bert-score/**'
      - '.github/workflows/python-bertscore-example.yml'
      - 'src/assertions/python.ts'
      - 'src/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  push:
    branches:
      - main
    paths:
      - 'examples/eval-bert-score/**'
      - '.github/workflows/python-bertscore-example.yml'
      - 'src/assertions/python.ts'
      - 'src/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: BERTScore assertion regressions (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only example dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.2.1
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c 'import importlib.metadata; print("torch==" + importlib.metadata.version("torch"))' > "$RUNNER_TEMP/torch-constraint.txt"
          python -m pip install --disable-pip-version-check -c "$RUNNER_TEMP/torch-constraint.txt" -r examples/eval-bert-score/requirements.txt
          python -m pip check

      - name: Run BERTScore assertion regressions
        run: python -m unittest discover -s examples/eval-bert-score -p '*_test.py' -v

      - name: Use Node for real scorer CLI smoke
        if: matrix.python-version == '3.14'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install CLI dependencies
        if: matrix.python-version == '3.14'
        run: |
          npm install -g npm@11.18.0
          npm ci

      - name: Exercise real BERTScore through both CLI configs
        if: matrix.python-version == '3.14'
        run: python examples/eval-bert-score/tests/smoke_cli.py
