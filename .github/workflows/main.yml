name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      coverage_base:
        description: 'Base commit or ref for coverage ratchets (use the PR base for stacked branches)'
        required: false
        type: string

permissions: &read-only-permissions
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VITE_TELEMETRY_DISABLED: 1
  NPM_CONFIG_AUDIT: 'false'
jobs:
  ci-config:
    name: CI Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.test-matrix }}
      build-matrix: ${{ steps.set-matrix.outputs.build-matrix }}
    steps:
      - name: Determine CI matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Shared entries: all Linux versions + one Windows Node version (sharded)
          base_entries='
            {"node":"22.22","os":"ubuntu-latest","shard":""},
            {"node":"24.x","os":"ubuntu-latest","shard":""},
            {"node":"26.x","os":"ubuntu-latest","shard":""},
            {"node":"22.22","os":"windows-2025-vs2026","shard":1},
            {"node":"22.22","os":"windows-2025-vs2026","shard":2},
            {"node":"22.22","os":"windows-2025-vs2026","shard":3}
          '
          # Node 24 builds the shared package in package-build below.
          build_matrix='{"node":["22.22","26.x"]}'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PRs: add 1 macOS version only
            extra_entries='
              ,{"node":"22.22","os":"macOS-latest","shard":""}
            '
          else
            # Main/dispatch: add all macOS versions + remaining Windows shards
            extra_entries='
              ,{"node":"22.22","os":"macOS-latest","shard":""},
              {"node":"24.x","os":"macOS-latest","shard":""},
              {"node":"24.x","os":"windows-2025-vs2026","shard":1},
              {"node":"24.x","os":"windows-2025-vs2026","shard":2},
              {"node":"24.x","os":"windows-2025-vs2026","shard":3},
              {"node":"26.x","os":"windows-2025-vs2026","shard":1},
              {"node":"26.x","os":"windows-2025-vs2026","shard":2},
              {"node":"26.x","os":"windows-2025-vs2026","shard":3}
            '
          fi

          # Build the matrix JSON (shard:"" is falsy in GHA expressions, used to skip shard flags)
          test_matrix=$(echo "{\"include\":[${base_entries}${extra_entries}]}" | jq -c .)
          echo "test-matrix=$test_matrix" >> "$GITHUB_OUTPUT"
          echo "build-matrix=$build_matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: ci-config
    name: Test on Node ${{ matrix.node }} and ${{ matrix.os }}${{ matrix.shard && format(' (shard {0}/3)', matrix.shard) || '' }}
    # Cold-cache Node 26 installs can approach 20m before the test phase starts, so leave room for the test body.
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    permissions: &test-reporting-permissions
      contents: read
      checks: write
      id-token: write # Required for OIDC authentication with Codecov
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-config.outputs.test-matrix) }}

    steps:
      - &checkout-two-commits
        name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Explicit dispatch bases may be older than the shallow checkout's parents.
          fetch-depth: ${{ inputs.coverage_base != '' && '0' || '2' }}
          persist-credentials: false

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Keep the matrix label at 22.22 for stable check names, but install exactly
          # 22.22.0 so this lane tests the engines floor itself rather than latest 22.22.x.
          node-version: ${{ matrix.node == '22.22' && '22.22.0' || matrix.node }}
          # Windows already caches node_modules below; compressing npm's download cache
          # again can stall post-job cleanup long after the tests finish.
          cache: ${{ runner.os != 'Windows' && 'npm' || '' }}
          package-manager-cache: false

      - &use-python-3-14
        name: Use Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: &python-3-14-8
          python-version: 3.14.8

      # Ruby 4.0.1 is not yet available on Windows via setup-ruby, use 4.0.0 on Windows
      - name: Use Ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1
        with:
          ruby-version: ${{ startsWith(matrix.os, 'windows-') && '4.0.0' || '4.0.1' }}

      # Cache node_modules to speed up installs (especially on Windows where npm ci is slow)
      # Key includes OS and Node version since native modules are platform/version specific
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json') }}

      - &use-npm-11
        name: Use npm 11
        run: npm install -g npm@11.11.0 --registry=https://registry.npmjs.org/

      - name: Install Dependencies${{ matrix.node == '26.x' && ' (Node 26)' || '' }}
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        # Node 26 hosted installs stall when lifecycle scripts run during npm ci.
        # Keep its final rebuild command: Windows PowerShell reports the last native exit code.
        run: |
          npm ci ${{ matrix.node == '26.x' && '--ignore-scripts' || '' }} --registry=https://registry.npmjs.org/
          ${{ matrix.node == '26.x' && 'npm rebuild better-sqlite3' || '' }}

      - name: Test
        # Treat a post-run forks-worker crash (all tests already passed, then the
        # worker dies on teardown -> "Worker exited unexpectedly") as non-fatal in
        # CI. Real test/assertion failures still fail; see vitest.config.ts.
        env:
          PROMPTFOO_IGNORE_UNHANDLED_TEST_ERRORS: 'true'
        run: npm run test${{ matrix.shard && format(' -- --shard={0}/3', matrix.shard) || '' }}${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22' && !matrix.shard && ' -- --coverage' || '' }}${{ startsWith(matrix.os, 'windows-') && ' --exclude=test/release-artifact.test.ts' || '' }}

      - name: Test release artifact acceptance without parallel workers
        # Cold npm install/rebuild fixtures need the runner's CPU and disk without
        # competing test forks. Run the unchanged suite once per Windows Node version.
        if: startsWith(matrix.os, 'windows-') && matrix.shard == 1
        run: npm run test -- test/release-artifact.test.ts --maxWorkers=1

      - name: Run built agent skill examples
        if: matrix.os != 'ubuntu-latest' && (!matrix.shard || matrix.shard == '1')
        run: |
          npx tsdown
          npm run postbuild
          npm run test:smoke -- test/smoke/agent-skill-examples.test.ts

      - name: Check Backend Coverage Ratchets
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.22' && !matrix.shard
        env:
          COVERAGE_BASE: ${{ inputs.coverage_base }}
        run: |
          args=(--report backend)
          if [[ -n "$COVERAGE_BASE" ]]; then
            args+=(--base "$COVERAGE_BASE")
          fi
          npm run test:coverage:ratchet -- "${args[@]}"

      - name: Upload Backend Coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.22' && !matrix.shard
        # Authentication can fail before fail_ci_if_error applies; uploads are informational.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          # Codecov upload is informational (coverage is gated in-repo, not by
          # Codecov); keep it non-blocking so Codecov infra outages can't fail main.
          fail_ci_if_error: false
          use_oidc: true
          # Pin the CLI version too: the action SHA pins the wrapper, but the CLI
          # binary it downloads is otherwise unpinned (action default is latest).
          version: v11.2.8

  build:
    needs: ci-config
    name: Build on Node ${{ matrix.node }}
    env:
      PROMPTFOO_POSTHOG_KEY: ${{ secrets.PROMPTFOO_POSTHOG_KEY }}
    # Cold-cache Node 26 installs can approach 20m before the build phase starts on GitHub-hosted runners.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.ci-config.outputs.build-matrix) }}

    steps:
      - &checkout-repo-read-only
        name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: &no-persisted-credentials
          persist-credentials: false

      - &use-build-node
        name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Keep the matrix label at 22.22 for stable check names, but install exactly
          # 22.22.0 so this lane tests the engines floor itself rather than latest 22.22.x.
          node-version: ${{ matrix.node == '22.22' && '22.22.0' || matrix.node }}
          cache: 'npm'

      - *use-npm-11

      - &install-build-dependencies
        name: Install Dependencies
        # The build does not need native dependency lifecycle scripts. Skipping them
        # keeps the Node 26 build lane out of the install stall seen on hosted runners.
        run: npm ci ${{ matrix.node == '26.x' && '--ignore-scripts' || '' }} --registry=https://registry.npmjs.org/

      - &build-source
        name: Build
        run: npm run build

      - &check-build-telemetry
        name: Check Telemetry
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Skip PostHog key check for forks as they don't have access to secrets
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$HEAD_REPO_FULL_NAME" != "$REPOSITORY" ]]; then
            echo "Skipping PostHog key check for fork PR"
          elif [[ -z "$PROMPTFOO_POSTHOG_KEY" ]]; then
            echo "PostHog key not available (running without secret), skipping check"
          else
            # PostHog key is injected at build time via tsup's define option
            # Check that it's present in the built output (it will be inlined as a string)
            if ! grep -rq '"phc_' dist/src/*.js; then
              echo "Error: PostHog key not found in built output"
              echo "Checking for POSTHOG_KEY patterns in built files:"
              grep -r "POSTHOG_KEY" dist/src/*.js | head -10 || echo "No POSTHOG_KEY found"
              exit 1
            fi
            echo "PostHog key replacement verified successfully"
          fi

      - &pack-package-artifact
        name: Pack Package Artifact
        id: package-artifact
        run: |
          tarball="$(npm run --silent package:pack -- --destination "$RUNNER_TEMP/package-artifact")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - &test-package-artifact
        name: Test Package Artifact
        env:
          PACKAGE_TARBALL: ${{ steps.package-artifact.outputs.tarball }}
          PROMPTFOO_DISABLE_TELEMETRY: 1
          RUNTIME_ASSETS: ${{ matrix.node == '24.x' && 'all' || 'none' }}
          npm_config_install_strategy: ${{ matrix.node == '22.22' && 'shallow' || 'hoisted' }}
        run: |
          browser_args=()
          if [ "$RUNTIME_ASSETS" = all ]; then
            browser_args+=(--browser)
            browser_args+=(--sbom-output "$RUNNER_TEMP/sbom-runtime")
          fi
          npm run test:package-artifact -- --tarball "$PACKAGE_TARBALL" --runtime-assets "$RUNTIME_ASSETS" "${browser_args[@]}"

      - &built-skill-examples
        name: Run built agent skill examples
        env:
          PROMPTFOO_POSTHOG_KEY: ''
        run: npm run test:smoke -- test/smoke/agent-skill-examples.test.ts

  contracts-isolation:
    needs: ci-config
    name: Isolated Contracts on Node ${{ matrix.node }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-config.outputs.build-matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node == '22.22' && '22.22.0' || matrix.node }}

      - name: Test Isolated Contracts
        # The script uses only Node builtins; no root dependency install or build secrets needed.
        # Pin npm 11 because bundled npm 10 crashes while resolving these standalone inputs.
        run: npx --ignore-scripts --registry=https://registry.npmjs.org/ -y npm@11.18.0 run test:contracts-isolation

  # Publish the Node 24 archive before Linux acceptance so platform checks can
  # validate the same immutable upload without waiting for any other build lane.
  package-build:
    name: Prepare package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: *read-only-permissions
    env:
      PROMPTFOO_POSTHOG_KEY: ${{ secrets.PROMPTFOO_POSTHOG_KEY }}
    strategy:
      matrix:
        node: ['24.x']
    steps:
      - *checkout-repo-read-only
      - *use-build-node
      - *use-npm-11
      - *install-build-dependencies
      - *build-source
      - *check-build-telemetry
      - *pack-package-artifact
      - *built-skill-examples

      - name: Upload package for platform acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promptfoo-platform-package
          path: ${{ steps.package-artifact.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  package-acceptance:
    # Preserve the required check name, including failures before an upload exists.
    name: Build on Node ${{ matrix.node }}
    needs: package-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: *read-only-permissions
    strategy:
      matrix:
        node: ['24.x']
    steps:
      - &require-package-build
        name: Require successful package build
        env:
          PACKAGE_BUILD_RESULT: ${{ needs.package-build.result }}
        run: test "$PACKAGE_BUILD_RESULT" = success
      - *checkout-repo-read-only
      - *use-build-node
      - *use-npm-11
      - *install-build-dependencies

      - name: Use Python for installed wrapper acceptance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: *python-3-14-8

      - name: Use Ruby for installed wrapper acceptance
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1
        with: &ruby-4-0-1
          ruby-version: '4.0.1'

      - name: Use Go for installed wrapper acceptance
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/golang/go.mod

      - &download-platform-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promptfoo-platform-package
          path: ${{ runner.temp }}/package-artifact
      - name: Locate downloaded package
        id: package-artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/package-artifact
        run: |
          shopt -s nullglob
          tarballs=("$ARTIFACT_DIRECTORY"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded package archive" >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - *test-package-artifact

      - name: Upload packed consumer inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-runtime
          path: ${{ runner.temp }}/sbom-runtime
          if-no-files-found: error
          retention-days: 30

      - name: Test Package Artifact Without Optional Dependencies
        env:
          PACKAGE_TARBALL: ${{ steps.package-artifact.outputs.tarball }}
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: npm run test:package-artifact -- --tarball "$PACKAGE_TARBALL" --profile omit-optional --runtime-assets all

  artifact-consumer:
    name: Installed package on ${{ matrix.os }}
    needs: package-build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # Fresh Windows consumer installs can take 17m; leave time for assertions and cleanup.
    timeout-minutes: ${{ matrix.os == 'windows-2025-vs2026' && 40 || 20 }}
    permissions: *read-only-permissions
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-2025-vs2026]
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: ${{ github.workspace }}/.artifact-npm-cache
    steps:
      - *require-package-build
      - &checkout-source-read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: *no-persisted-credentials
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - *use-npm-11
      - *download-platform-package
      - name: Prepare isolated artifact tooling
        id: prepare
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/package-artifact
        run: node scripts/preparePackageArtifactTest.mjs --artifact-directory "$ARTIFACT_DIRECTORY"
      - name: Install isolated artifact tooling
        working-directory: ${{ steps.prepare.outputs.tooling }}
        # TypeScript's native compiler needs its optional platform package.
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Test the downloaded package
        working-directory: ${{ steps.prepare.outputs.tooling }}
        env:
          PACKAGE_TARBALL: ${{ steps.prepare.outputs.tarball }}
          PROMPTFOO_DISABLE_TELEMETRY: 1
        run: npm run test:artifact -- --tarball "$PACKAGE_TARBALL"

  style-check:
    name: Style Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - *checkout-repo-read-only

      - &use-node
        name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - &upgrade-npm
        name: Upgrade npm
        run: npm install -g npm@11.18.0

      # Madge's TypeScript peer dependency differs from the repository's compiler.
      - name: Install CI tools
        run: |
          npm install --prefix "$RUNNER_TEMP/promptfoo-ci-tools" --ignore-scripts \
            check-dependency-version-consistency@6.0.0 madge@8.0.0 lockfile-lint@5.0.1

      - name: Install Dependencies
        # Static checks do not need browser downloads or native addon builds.
        run: npm ci --ignore-scripts

      - name: Run Biome CI
        run: |
          npm run lint:ci

      - name: Run Prettier Check
        run: |
          npm run format:check:prettier

      - name: Check Dependency Versions
        run: |
          "$RUNNER_TEMP/promptfoo-ci-tools/node_modules/.bin/check-dependency-version-consistency"

      - name: Check for circular dependencies
        run: |
          # shellcheck disable=SC2046
          "$RUNNER_TEMP/promptfoo-ci-tools/node_modules/.bin/madge" $(git ls-files '*.ts') --circular

      - name: Check architecture boundaries
        run: |
          npm run architecture:check

      - name: Check dependencies, unused files, and exports
        run: |
          npm run knip -- --no-progress --reporter github-actions

      - name: Validate lockfile integrity
        run: |
          "$RUNNER_TEMP/promptfoo-ci-tools/node_modules/.bin/lockfile-lint" --path package-lock.json --allowed-hosts npm --validate-https

  shell-format:
    name: Shell Format Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install shfmt
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
            https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 \
            --output "$RUNNER_TEMP/shfmt"
          printf '%s  %s\n' 'd9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea' "$RUNNER_TEMP/shfmt" | sha256sum --check
          chmod +x "$RUNNER_TEMP/shfmt"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check shell formatting
        env:
          NO_COLOR: '1'
        run: |
          # shfmt 3.12.0 cannot disable EditorConfig ignore rules during discovery.
          find . -name .git -prune -o -name .editorconfig -exec rm -f -- {} +
          printf 'root = true\n' > .editorconfig
          "$RUNNER_TEMP/shfmt" -f=0 . > "$RUNNER_TEMP/shell-files.txt"
          shell_files=()
          while IFS= read -r -d '' file; do
            shell_files+=("$file")
          done < "$RUNNER_TEMP/shell-files.txt"
          if (( ${#shell_files[@]} > 0 )); then
            "$RUNNER_TEMP/shfmt" -i 2 -d -- "${shell_files[@]/#/./}"
          fi

  assets:
    name: Generate Assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - *checkout-repo-read-only

      - *use-node

      - name: Use Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # The pinned ModelAudit schema generator requires Python <3.14.
          python-version: '3.13'

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Install ModelAudit schema dependencies
        run: python3 -m pip install --disable-pip-version-check --no-deps -r scripts/modelaudit_schema_requirements.txt

      - name: Generate JSON Schemas
        run: |
          npm run jsonSchema:generate
          npm run modelAuditSchema:generate

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected after generating assets:"
            git status --porcelain
            exit 1
          else
            echo "No changes detected."
          fi

  python:
    name: Check Python
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.14]
    steps:
      - *checkout-repo-read-only

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install ruff==0.15.1

      - name: Check Formatting
        run: |
          ruff check --select F401,F841,I --fix
          ruff format
          git diff --exit-code || (echo "Files were modified by ruff. Please commit these changes." && exit 1)

      - name: Run Tests
        run: |
          python -m unittest discover -s src/python -p '*_test.py'

  docs:
    name: Build Docs
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - *checkout-repo-read-only

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - &install-dependencies
        name: Install Dependencies
        run: npm ci

      - name: Type Check
        working-directory: site
        run: npm run typecheck

      - name: Build Documentation
        working-directory: site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload docs browser inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-site
          path: site/build/browser-inventory.json
          if-no-files-found: error
          retention-days: 30

  sbom-comparison:
    name: Compare shipped dependency inventories
    needs: [build, package-acceptance, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - *checkout-source-read-only
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-runtime
          path: ${{ runner.temp }}/sbom-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-site
          path: ${{ runner.temp }}/sbom-site
      # Only this API/download step has a token; neither PR scripts nor downloaded
      # artifact contents execute with credentials. Never use pull_request_target.
      - name: Find exact base inventory
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          status=no-base
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            run_id="$(gh api "repos/$GH_REPO/actions/workflows/main.yml/runs?event=push&branch=main&head_sha=$BASE_SHA&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')"
            status=no-successful-run
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              artifact="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "sbom-inventory")][0] // empty')"
              status=missing-artifact
              if [[ -n "$artifact" ]]; then
                status=expired-artifact
                if [[ "$(jq -r '.expired' <<< "$artifact")" == false ]]; then
                  gh run download "$run_id" --name sbom-inventory --dir "$RUNNER_TEMP/sbom-baseline"
                  status=available
                fi
              fi
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Compare runtime and browser inventories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
        run: |
          cp "$RUNNER_TEMP/sbom-site/browser-inventory.json" "$RUNNER_TEMP/sbom-current/site-browser.json"
          node scripts/compareSbom.ts \
            --current "$RUNNER_TEMP/sbom-current" \
            --baseline "$RUNNER_TEMP/sbom-baseline" \
            --baseline-status "$BASELINE_STATUS" \
            --source-sha "$GITHUB_SHA" --base-sha "$BASE_SHA" \
            --output "$RUNNER_TEMP/sbom-report"
      - name: Upload SBOM comparison and next baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-inventory
          path: ${{ runner.temp }}/sbom-report
          if-no-files-found: error
          retention-days: 90

  code-scan-action:
    name: Code Scan Action
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - *checkout-repo-read-only

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      # Install root dependencies first (code-scan-action imports from ../../src/types/codeScan.ts which needs zod)
      - name: Install Root Dependencies
        # Type checking and bundling do not need browser downloads or native addon builds.
        run: npm ci --ignore-scripts

      - name: Install Code Scan Action Dependencies
        working-directory: code-scan-action
        run: npm ci --ignore-scripts

      - name: Type Check
        working-directory: code-scan-action
        run: npm run tsc

      - name: Build Action
        working-directory: code-scan-action
        run: npm run build

  site-tests:
    name: Site tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: *test-reporting-permissions # Required for OIDC authentication with Codecov
    steps:
      - &checkout-repo
        name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *install-dependencies

      - name: Run Site Tests with Coverage
        working-directory: site
        run: npm run test:coverage

      # Site has no coverage ratchet, so the Codecov upload is the only consumer of
      # this report. Since that upload is now non-blocking, verify the artifact was
      # produced here — otherwise a missing/misnamed report would fail silently.
      - name: Verify site coverage report exists
        run: test -s ./site/coverage/coverage-final.json

      - name: Upload Site Coverage to Codecov
        # Authentication can fail before fail_ci_if_error applies; uploads are informational.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./site/coverage/coverage-final.json
          flags: site
          name: site-coverage
          # Codecov upload is informational (coverage is gated in-repo, not by
          # Codecov); keep it non-blocking so Codecov infra outages can't fail main.
          fail_ci_if_error: false
          use_oidc: true
          # Pin the CLI version too: the action SHA pins the wrapper, but the CLI
          # binary it downloads is otherwise unpinned (action default is latest).
          version: v11.2.8

  webui:
    name: webui tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: *test-reporting-permissions # Required for OIDC authentication with Codecov
    steps:
      - *checkout-two-commits

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *install-dependencies

      # Browser binaries are opt-in; install the version from the locked SDK.
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run App Browser Tests
        run: npm run test:app:browser

      - name: Run App Tests with Coverage
        run: npm run test:coverage --prefix src/app

      - name: Check Frontend Coverage Ratchets
        env:
          COVERAGE_BASE: ${{ inputs.coverage_base }}
        run: |
          args=(--report frontend)
          if [[ -n "$COVERAGE_BASE" ]]; then
            args+=(--base "$COVERAGE_BASE")
          fi
          npm run test:coverage:ratchet -- "${args[@]}"

      - name: Upload Frontend Coverage to Codecov
        # Authentication can fail before fail_ci_if_error applies; uploads are informational.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./src/app/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          # Codecov upload is informational (coverage is gated in-repo, not by
          # Codecov); keep it non-blocking so Codecov infra outages can't fail main.
          fail_ci_if_error: false
          use_oidc: true
          # Pin the CLI version too: the action SHA pins the wrapper, but the CLI
          # binary it downloads is otherwise unpinned (action default is latest).
          version: v11.2.8

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout-repo-read-only

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *use-python-3-14

      - &use-ruby
        name: Use Ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1
        with: *ruby-4-0-1

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Integration Tests
        run: npm run test:integration -- --coverage

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout-repo

      # Keep real unsupported and minimum-supported runtimes available while
      # installing dependencies, building, and running Vitest on the repo Node.
      - name: Set up unsupported Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.0'

      - name: Record unsupported Node executable
        run: echo "PROMPTFOO_NODE20_BIN=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - name: Set up minimum supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'

      - name: Record minimum supported Node executable
        run: echo "PROMPTFOO_MIN_NODE_BIN=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *use-python-3-14

      - *use-ruby

      - *install-dependencies

      - name: Build
        run: npm run build

      - name: Run Smoke Tests
        run: npm run test:smoke

  share-test:
    name: Share Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: *read-only-permissions
    steps:
      - *checkout-repo

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *install-dependencies

      - name: Run local server
        run: |
          mkdir -p "$RUNNER_TEMP/promptfoo-share-test"
          npm run build
          server_log="$RUNNER_TEMP/promptfoo-share-test/server.log"
          PROMPTFOO_CONFIG_DIR="$HOME/tmp" LOG_LEVEL=DEBUG API_PORT=8500 node dist/src/server/index.js >"$server_log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$server_log" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before becoming ready"
              cat "$SERVER_LOG"
              exit 1
            fi

            if curl -fsS -o /dev/null http://localhost:8500/health; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/45"
            sleep 2
          done
          echo "Server failed to start"
          cat "$SERVER_LOG"
          exit 1

      - name: run promptfoo eval
        id: eval
        run: |
          PROMPTFOO_REMOTE_API_BASE_URL=http://localhost:8500 PROMPTFOO_SHARING_APP_BASE_URL=http://localhost:8500  node dist/src/main.js eval -c .github/assets/promptfooconfig.yaml --share
        env:
          PROMPTFOO_DISABLE_TELEMETRY: 1

      - name: Test that the eval results are uploaded
        run: |
          response=$(curl -s http://localhost:8500/api/results)
          echo "Response: $response"

          # Use jq to extract the array length
          count=$(echo "$response" | jq '.data | length')
          echo "Array Length: $count"

          # Check if the count is exactly 1
          if [ "$count" -ne 1 ]; then
            echo "Error: Expected 1 entry, but got $count"
            exit 1
          fi

      - name: Dump server log on failure
        if: failure()
        run: |
          if [ -f "$SERVER_LOG" ]; then
            cat "$SERVER_LOG"
          fi

      - name: Share to cloud
        if: env.PROMPTFOO_STAGING_API_KEY != ''
        env:
          PROMPTFOO_STAGING_API_KEY: ${{ secrets.PROMPTFOO_STAGING_API_KEY }}
        run: |
          node dist/src/main.js auth login -k ${{ secrets.PROMPTFOO_STAGING_API_KEY }} -h https://api.promptfoo-staging.app
          node dist/src/main.js eval -c .github/assets/promptfooconfig.yaml --share

      - name: Stop local server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
            kill "$SERVER_PID"
            wait "$SERVER_PID" || true
          fi

  redteam:
    name: Redteam (Production API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout-repo

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *install-dependencies

      - name: Run Redteam (Production API)
        run: &redteam-integration-command |
          npm run test:redteam:integration

  redteam-staging:
    name: Redteam (Staging API)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: *read-only-permissions
    steps:
      - *checkout-repo

      - *use-node

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669).
      # Pinned exact (not @latest): npm 12.0.0 blocks postinstall scripts not covered by
      # allowScripts, which silently skips e.g. the Playwright browser download.
      - *upgrade-npm

      - *install-dependencies

      # Need to build first so we can login
      - name: Build
        run: |
          npm run build

      - name: Login
        if: env.PROMPTFOO_INTEGRATION_TEST_API_KEY != ''
        env:
          PROMPTFOO_INTEGRATION_TEST_API_KEY: ${{ secrets.PROMPTFOO_INTEGRATION_TEST_API_KEY }}
        run: |
          npm run bin auth login -- -k ${{ secrets.PROMPTFOO_INTEGRATION_TEST_API_KEY }} -h ${{ secrets.PROMPTFOO_INTEGRATION_TEST_API_HOST }}

      - name: Run Redteam with Staging API
        continue-on-error: true
        run: *redteam-integration-command

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *read-only-permissions
    steps:
      - *checkout-repo

      - name: Install and run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  ruby:
    name: Check Ruby
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.0', '3.4']
    steps:
      - *checkout-repo

      - name: Use Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Install Dependencies
        run: |
          gem install rubocop

      - name: Check Formatting
        run: |
          rubocop --autocorrect-all src/ruby/
          git diff --exit-code || (echo "Files were modified by rubocop. Please commit these changes." && exit 1)

      - name: Test Ruby Wrapper
        run: |
          # Create a simple test script
          cat > /tmp/test_script.rb << 'EOF'
          def test_function(a, b)
            { "sum" => a + b, "product" => a * b }
          end
          EOF

          # Create input JSON
          echo '[2, 3]' > /tmp/input.json

          # Run the wrapper
          ruby src/ruby/wrapper.rb /tmp/test_script.rb test_function /tmp/input.json /tmp/output.json

          # Verify output
          cat /tmp/output.json
          if ! grep -q '"sum":5' /tmp/output.json; then
            echo "Error: Ruby wrapper test failed"
            exit 1
          fi
          echo "Ruby wrapper test passed"

  golang:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout-repo

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/golang/go.mod
          check-latest: true

      - name: Run wrapper tests
        working-directory: src/golang
        run: |
          go test -v wrapper.go wrapper_test.go
