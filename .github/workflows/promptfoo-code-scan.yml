name: Promptfoo Code Scan

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to scan'
        required: true

permissions:
  contents: read

concurrency:
  # Scans run up to 15 minutes, so with the `synchronize` trigger a second push can land
  # while the first scan is still going. Without this the superseded run keeps scanning an
  # outdated checkout and posts review comments against a head that is no longer current.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PROMPTFOO_DISABLE_UPDATE: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Resolve manual PR commits
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid \
            --jq '"head_sha=\(.headRefOid)\nbase_sha=\(.baseRefOid)"' >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load scan policy from the base commit
        id: policy
        shell: node {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base_sha }}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const policyDir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'promptfoo-scan-policy-'));
          const archive = `${policyDir}.tar`;
          execFileSync('git', ['archive', '--format=tar', '--output', archive, process.env.BASE_SHA]);
          // GNU tar interprets a Windows drive prefix on an archive name as a remote host.
          execFileSync('tar', ['-xf', path.basename(archive), '-C', path.basename(policyDir)], {
            cwd: path.dirname(archive),
          });
          fs.unlinkSync(archive);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `config_path=${path.join(policyDir, '.github/promptfoo-code-scan.yaml')}\n`);

      # Retain the existing PATH Node pin for the action's npm fallback.
      # The action installs and runs the scanner with its own Node 24 runtime.
      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      # This release installs its pinned CLI before minting the short-lived OIDC token.
      - name: Run Promptfoo Code Scan
        uses: promptfoo/code-scan-action@11b7322013b2ba70a311b596c90dad5bcbea8634 # v0.2.2
        with:
          min-severity: medium
          config-path: ${{ steps.policy.outputs.config_path }}
          enable-fork-prs: true
