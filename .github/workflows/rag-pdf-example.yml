name: RAG PDF example

on:
  pull_request:
    paths:
      - 'examples/eval-rag-full/**'
      - '.github/workflows/rag-pdf-example.yml'
      - 'src/providers/pythonCompletion.ts'
      - 'src/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'examples/eval-rag-full/**'
      - '.github/workflows/rag-pdf-example.yml'
      - 'src/providers/pythonCompletion.ts'
      - 'src/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  pdf-ingestion:
    name: PDF ingestion on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        working-directory: examples/eval-rag-full
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install example dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Exercise PDF downloads and ingestion
        run: python -m unittest discover -s tests -v
      - name: Use Node for the CLI smoke
        if: matrix.python-version == '3.14'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
      - name: Install CLI dependencies
        if: matrix.python-version == '3.14'
        working-directory: .
        run: |
          npm install -g npm@11.18.0
          npm ci
      - name: Exercise persisted retrieval through the original CLI config
        if: matrix.python-version == '3.14'
        working-directory: .
        run: python examples/eval-rag-full/tests/smoke_cli.py
