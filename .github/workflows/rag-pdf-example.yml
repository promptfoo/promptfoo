name: RAG PDF example

on:
  pull_request:
    paths:
      - 'examples/eval-rag-full/**'
      - '.github/workflows/rag-pdf-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/eval-rag-full/**'
      - '.github/workflows/rag-pdf-example.yml'

permissions:
  contents: read

jobs:
  pdf-ingestion:
    name: PDF ingestion on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        working-directory: examples/eval-rag-full
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install example dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Exercise PDF downloads and ingestion
        run: python -m unittest discover -s tests -v
