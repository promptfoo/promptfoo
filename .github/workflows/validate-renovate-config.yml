name: Validate Renovate Config

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.nvmrc'
      - '.github/scripts/validate-renovate-python-holds.mjs'
      - '.github/workflows/validate-renovate-config.yml'
  push:
    branches:
      - main
    paths:
      - 'renovate.json'
      - '.nvmrc'
      - '.github/scripts/validate-renovate-python-holds.mjs'
      - '.github/workflows/validate-renovate-config.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Renovate validation tools
        run: >-
          npm install --prefix "$RUNNER_TEMP/renovate-tool"
          --ignore-scripts --no-package-lock --no-audit --no-fund
          --registry=https://registry.npmjs.org/ renovate@44.90.0

      - name: Validate renovate.json
        run: node "$RUNNER_TEMP/renovate-tool/node_modules/renovate/dist/config-validator.js"

      - name: Check Python compatibility holds with Renovate
        run: >-
          node .github/scripts/validate-renovate-python-holds.mjs
          "$RUNNER_TEMP/renovate-tool/node_modules/renovate"
