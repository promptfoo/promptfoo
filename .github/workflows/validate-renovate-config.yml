name: Validate Renovate Config

on:
  pull_request:
    paths: &watched-paths
      - 'renovate.json'
      - '.nvmrc'
      - '.github/workflows/validate-renovate-config.yml'
  push:
    branches:
      - main
    paths: *watched-paths

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Renovate validation tools
        run: >-
          npm install --prefix "$RUNNER_TEMP/renovate-tool"
          --no-package-lock --no-audit --no-fund
          --registry=https://registry.npmjs.org/ renovate@44.90.0

      - name: Validate renovate.json
        run: node "$RUNNER_TEMP/renovate-tool/node_modules/renovate/dist/config-validator.js"
