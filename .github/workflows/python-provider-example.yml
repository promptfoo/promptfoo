name: Python Provider Upgrade

on:
  pull_request:
    paths:
      - 'examples/provider-python/**'
      - '.github/workflows/python-provider-example.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/provider-python/**'
      - '.github/workflows/python-provider-example.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Python provider upgrade (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The main CI workflow covers a fresh install on Python 3.14.
      - name: Use Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Seed an existing environment with older transport packages
        run: >-
          python -m pip install --disable-pip-version-check
          'openai==2.3.0' 'httpcore==1.0.7' 'h11==0.14.0'
          'idna==3.6' 'certifi==2023.11.17'

      - name: Install example dependencies
        run: python -m pip install --disable-pip-version-check -r examples/provider-python/requirements.txt

      - name: Run dependency regressions
        run: python -m unittest discover -s examples/provider-python -p '*_test.py' -v
