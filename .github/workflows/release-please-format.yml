name: release-please-format
run-name: Review release notes for PR ${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - CHANGELOG.md
      - code-scan-action/CHANGELOG.md
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: release-notes-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  format:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'promptfoobot[bot]' &&
       startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '<!-- reviewed-release-notes -->') ||
        startsWith(github.event.changes.body.from, '<!-- reviewed-release-notes -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # Use only protected-branch tooling. The script reads the proposed manifest
      # and changelog as git objects and never checks out or executes the PR tree.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install isolated Markdown parser and formatter
        working-directory: ${{ runner.temp }}
        run: npm install --prefix prettier-install --no-save --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/ prettier@3.8.1
      - name: Prepare and validate the reviewed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_notes.py prepare "$PR" "$RUNNER_TEMP/notes-input.json"
      - name: Format release Markdown without credentials
        id: prepare
        run: |
          if [[ ! -f "$RUNNER_TEMP/notes-input.json" ]]; then exit 0; fi
          python .github/scripts/release_notes.py format "$RUNNER_TEMP/notes-input.json" "$RUNNER_TEMP/notes-plan.json" "$RUNNER_TEMP/prettier-install/node_modules/.bin/prettier"
          if [[ -f "$RUNNER_TEMP/notes-plan.json" ]]; then echo "update=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create App token for the reviewed changelog and PR preview
        if: steps.prepare.outputs.update == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.PROMPTFOOBOT_APP_ID }}
          private-key: ${{ secrets.PROMPTFOOBOT_APP_PRIVATE_KEY }}
      - name: Apply notes to the verified release branch
        if: steps.prepare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python .github/scripts/release_notes.py apply "$PR" "$RUNNER_TEMP/notes-plan.json"
