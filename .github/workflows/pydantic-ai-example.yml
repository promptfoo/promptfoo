name: PydanticAI example

on:
  pull_request:
    paths: &watched-paths
      - 'examples/integration-pydantic-ai/**'
      - 'src/**'
      - 'scripts/**'
      - 'drizzle/**'
      - '.nvmrc'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - '.github/workflows/pydantic-ai-example.yml'
  push:
    branches: [main]
    paths: *watched-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install Promptfoo
        run: |
          npm install -g npm@11.19.0 --registry=https://registry.npmjs.org/
          npm ci --registry=https://registry.npmjs.org/
      - name: Install example dependencies
        run: |
          python -m pip install -r examples/integration-pydantic-ai/requirements.txt
          python -m pip check
      - name: Run the real SDK and example with a local model fixture
        run: python -m unittest discover -s examples/integration-pydantic-ai/tests -v
