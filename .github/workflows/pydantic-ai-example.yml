name: PydanticAI example

on:
  pull_request:
    paths:
      - 'examples/integration-pydantic-ai/**'
      - 'src/python/**'
      - 'src/providers/pythonCompletion.ts'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pydantic-ai-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/integration-pydantic-ai/**'
      - 'src/python/**'
      - 'src/providers/pythonCompletion.ts'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pydantic-ai-example.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Promptfoo
        run: |
          npm install -g npm@11.19.0 --registry=https://registry.npmjs.org/
          npm ci --registry=https://registry.npmjs.org/
      - name: Install example dependencies
        run: |
          python -m pip install -r examples/integration-pydantic-ai/requirements.txt
          python -m pip check
      - name: Run the real SDK and example with a local model fixture
        run: python -m unittest discover -s examples/integration-pydantic-ai/tests -v
