name: Redteam API example

on:
  pull_request:
    paths:
      - 'examples/redteam-api-top-10/**'
      - '.github/workflows/redteam-api-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/redteam-api-top-10/**'
      - '.github/workflows/redteam-api-example.yml'

permissions:
  contents: read

jobs:
  mcp-client:
    name: MCP client on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    defaults:
      run:
        working-directory: examples/redteam-api-top-10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install example and launcher
        run: |
          python -m pip install . uv==0.12.18
          python -m pip check
      - name: Exercise the real SQLite MCP server
        run: python -m unittest discover -s tests -v
