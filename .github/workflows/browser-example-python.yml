name: Browser Example Python

on:
  pull_request:
    paths: &watched-paths
      - 'examples/integration-browser/headless/**'
      - 'src/**'
      - 'scripts/**'
      - 'drizzle/**'
      - '.nvmrc'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/browser-example-python.yml'
  push:
    branches: [main]
    paths: *watched-paths

permissions:
  contents: read

jobs:
  gradio-demo:
    name: Gradio demo on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: &no-persisted-credentials
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install demo dependencies
        run: |
          python -m pip install -r examples/integration-browser/headless/requirements.txt
          python -m pip check
      - name: Test demo startup and interactions
        run: python -m unittest discover -s examples/integration-browser/headless -p 'test_*.py' -v

  browser-eval:
    name: Headless browser evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: *no-persisted-credentials
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install the CLI, demo and Chromium
        run: |
          npm ci --registry=https://registry.npmjs.org/
          python -m pip install -r examples/integration-browser/headless/requirements.txt
          npx playwright install --with-deps chromium
      - name: Run both examples against the demo
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          output_dir = pathlib.Path(os.environ['RUNNER_TEMP']) / 'browser-results'
          output_dir.mkdir()
          os.environ['PROMPTFOO_CONFIG_DIR'] = str(output_dir / 'config')
          server = subprocess.Popen([sys.executable, 'examples/integration-browser/headless/gradio_demo.py'])
          try:
              for attempt in range(60):
                  if server.poll() is not None:
                      raise RuntimeError('Gradio exited before startup')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:7860/config', timeout=1):
                          break
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(1)
              else:
                  raise RuntimeError('Gradio did not start')
              for config, count in [('promptfooconfig.yaml', 3), ('calculator-example.yaml', 2)]:
                  output = output_dir / (config + '.json')
                  subprocess.run([
                      'npm', 'run', 'local', '--', 'eval', '-c',
                      'examples/integration-browser/headless/' + config,
                      '--no-cache', '--no-write', '--max-concurrency', '1', '-o', str(output),
                  ], check=True, timeout=180)
                  results = json.loads(output.read_text())['results']
                  assert len(results['results']) == count
                  assert results['stats']['successes'] == count
                  assert results['stats']['failures'] == results['stats']['errors'] == 0
                  assert all(row['success'] and row['score'] == 1 and not row.get('error')
                             for row in results['results'])
          finally:
              server.terminate()
              try:
                  server.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  server.kill()
                  server.wait()
          PY
