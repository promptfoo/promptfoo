name: Browser Example Python

on:
  pull_request:
    paths:
      - 'examples/integration-browser/headless/**'
      - '.github/workflows/browser-example-python.yml'
  push:
    branches: [main]
    paths:
      - 'examples/integration-browser/headless/**'
      - '.github/workflows/browser-example-python.yml'

permissions:
  contents: read

jobs:
  gradio-demo:
    name: Gradio demo on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install demo dependencies
        run: |
          python -m pip install -r examples/integration-browser/headless/requirements.txt
          python -m pip check
      - name: Test demo startup and interactions
        run: python -m unittest discover -s examples/integration-browser/headless -p 'test_*.py' -v
