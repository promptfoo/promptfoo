name: E2B Example

on:
  pull_request:
    paths:
      - 'examples/integration-e2b/**'
      - '.github/workflows/e2b-example-python.yml'
  push:
    branches: [main]
    paths:
      - 'examples/integration-e2b/**'
      - '.github/workflows/e2b-example-python.yml'

permissions:
  contents: read

jobs:
  e2b-sdk:
    name: E2B SDK on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E2B SDK
        run: |
          python -m pip install 'e2b-code-interpreter==2.10.0'
          python -m pip check
      - name: Test SDK signatures and sandbox controls without cloud access
        run: python -m unittest discover -s examples/integration-e2b -p '*_test.py' -v
