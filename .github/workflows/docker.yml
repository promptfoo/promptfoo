# This GitHub Action builds the Docker image Promptfoo,
# runs the Docker container, performs a health check to ensure the application
# is running correctly, and then publishes the image to GitHub Container Registry
# if all checks pass. This action is triggered by the release-please workflow,
# published human-created releases, workflow dispatch, pull requests that
# modify the Docker/runtime update contract, and matching pushes to main.

name: Test and Publish Multi-arch Docker Image
run-name: |
  ${{ (inputs.tag_name || github.event.release.tag_name) && 'Release' ||
      github.event_name == 'workflow_dispatch' && 'Manual' ||
      github.event_name == 'pull_request' && 'PR' ||
      'Push' }}
  Docker build for ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  ${{ github.event_name == 'pull_request' && format('(PR #{0})', github.event.number) || '' }}
  by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'The release tag name (e.g., 0.120.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag to publish (e.g., 0.121.6)'
        required: false
        type: string
  release:
    types:
      - published
  pull_request:
    # Include stacked PRs so their final images receive the same runtime checks.
    paths: &runtime-paths
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/testDockerImage.js'
      - 'src/envars.ts'
      - 'src/server/routes/version*.ts'
      - 'src/types/api/version.ts'
      - 'src/updates.ts'
      - 'src/updates/**'
  push:
    branches:
      - main
    paths: *runtime-paths

concurrency:
  # Reusable workflow calls inherit the caller's github.workflow value. Keep this
  # group Docker-specific so release-please callers are not cancelled mid-release.
  group: ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.ref) || format('docker-publish-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || '' }}
  SOURCE_REF: ${{ inputs.tag_name || github.event.release.tag_name || github.sha }}
  BUILD_VERSION: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  BUILD_DATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.updated_at || github.event_name == 'release' && github.event.release.published_at || github.event.head_commit.timestamp || github.event.repository.updated_at }}
  # Fallback release paths build a specific tag outside release-please.yml.
  IS_RELEASE_FALLBACK: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') || github.event_name == 'release' }}

permissions: &read-only-permissions
  contents: read

jobs:
  test:
    # Bot-authored releases are already handled by release-please.yml after npm publish.
    # The release event path is for human-published fallback releases and backfills.
    if: github.event_name != 'release' || github.event.release.author.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: *read-only-permissions
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tags: ${{ steps.image.outputs.tags }}
      version: ${{ steps.image.outputs.version }}
      created: ${{ steps.image.outputs.created }}
      license: ${{ steps.image.outputs.license }}
    steps:
      - &validate-release-tag
        name: Validate release tag
        if: github.event_name == 'release' || env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::RELEASE_TAG '$RELEASE_TAG' is empty or invalid"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      # github.sha is the trigger SHA; SOURCE_REF can point checkout at a different tag.
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Fix publication aliases before executing source code, including code from historical releases.
      # Only the numeric version and prerelease affect Docker tags; SemVer build metadata is omitted.
      - name: Prepare Docker image metadata
        id: image
        if: github.event_name != 'pull_request'
        env:
          REPO_LICENSE: ${{ github.event.repository.license.spdx_id }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { GITHUB_REF: ref, GITHUB_REF_NAME: name, RELEASE_TAG: release } = process.env;
          const version = name.replace(/[^a-zA-Z0-9._-]+/g, '-');
          const tags = new Set();

          // An explicit backfill publishes only its immutable release tag.
          if (process.env.IS_RELEASE_FALLBACK !== 'true') {
            if (ref.startsWith('refs/heads/')) {
              tags.add(version);
              if (ref === 'refs/heads/main') {
                tags.add('latest');
              }
            } else if (ref.startsWith('refs/tags/')) {
              const number = '(0|[1-9][0-9]*)';
              const id = '(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)';
              const semver = new RegExp(
                `^v?${number}\\.${number}\\.${number}(?:-(${id}(?:\\.${id})*))?(?:\\+[0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*)?$`
              );
              const match = semver.exec(name.replaceAll('/', '-'));
              if (match && match.slice(1, 4).every(part => Number.isSafeInteger(Number(part)))) {
                const [, major, minor, patch, prerelease] = match;
                tags.add(`${major}.${minor}.${patch}${prerelease ? '-' + prerelease : ''}`);
                if (!prerelease) {
                  tags.add(`${major}.${minor}`);
                  tags.add('latest');
                }
              }
            }
            tags.add(`sha-${process.env.GITHUB_SHA.slice(0, 7)}`);
          }
          if (release) {
            tags.add(release);
          }
          if (!tags.size || [...tags].some(tag => !/^\w[\w.-]{0,127}$/.test(tag))) {
            throw new Error('Invalid Docker publication tags');
          }
          const license = process.env.REPO_LICENSE || require('./package.json').license;
          const outputs = {
            tags: [...tags].join(' '),
            version,
            created: new Date().toISOString(),
            license: typeof license === 'string' ? license.replace(/[\r\n]+/g, ' ') : '',
          };
          for (const [key, value] of Object.entries(outputs)) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - &set-up-docker-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build official Docker image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-amd64
          context: .
          push: false
          load: true
          tags: local-test-image:official
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=1
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build custom Docker image for contract testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-amd64
          context: .
          push: false
          load: true
          tags: local-test-image:custom
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=0
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test final-image runtime dependencies
        run: |
          docker run --rm --network none -i \
            -e PROMPTFOO_TEST_PRODUCTION_DEPS=1 \
            local-test-image:official node --input-type=module < scripts/testDockerImage.js

      # The registry cache replays the base stage, so only the final-stage upgrade is fresh.
      - name: Verify OS packages are current
        run: |
          # Fetch the indexes first: a simulated upgrade does not refresh them itself.
          plan="$(docker run --rm --user 0 local-test-image:official sh -c 'apk update --quiet && apk upgrade --simulate')"
          echo "$plan"
          if grep -q Upgrading <<< "$plan"; then
            echo "::error::The image is missing Alpine package upgrades"
            exit 1
          fi

      - name: Run Docker containers for testing
        run: |
          docker run -d --name promptfoo-container -p 3000:3000 local-test-image:official
          docker run -d --name promptfoo-custom-container -p 3001:3000 local-test-image:custom

      - name: Run health check
        run: |
          # Wait for both servers to be fully ready (including database migrations)
          # before running any CLI commands that also trigger migrations.
          for port in 3000 3001; do
            HEALTH_CHECK_PASS=
            for ((retry=1; retry<=10; retry++)); do
              if curl -f "http://localhost:${port}/health"; then
                echo -e "\nHealth check passed on port ${port}"
                HEALTH_CHECK_PASS=true
                break
              else
                echo "Health check on port ${port} failed, retrying in 2 seconds..."
                sleep 2
              fi
            done

            if [ -z "$HEALTH_CHECK_PASS" ]; then
              echo -e "\nHealth check on port ${port} failed after multiple attempts" >&2
              exit 1
            fi
          done

      - name: Verify Python and promptfoo
        run: |
          echo "Checking Python version:"
          if ! docker exec promptfoo-container python --version; then
            echo "Python check failed"
            exit 1
          fi

          echo "Checking promptfoo version:"
          if ! docker exec promptfoo-container promptfoo --version; then
            echo "promptfoo check failed"
            exit 1
          fi

          echo "Checking pf alias:"
          if ! docker exec promptfoo-container pf --version; then
            echo "pf alias check failed"
            exit 1
          fi

          echo "Checking container update markers and API guidance:"
          test "$(docker exec promptfoo-container printenv PROMPTFOO_RUNNING_IN_DOCKER)" = "1"
          test "$(docker exec promptfoo-container printenv PROMPTFOO_OFFICIAL_DOCKER_IMAGE)" = "1"
          test "$(docker exec promptfoo-custom-container printenv PROMPTFOO_RUNNING_IN_DOCKER)" = "1"
          test "$(docker exec promptfoo-custom-container printenv PROMPTFOO_OFFICIAL_DOCKER_IMAGE)" = "0"

          curl -fsS http://localhost:3000/api/version | jq -e '
            .commandType == "docker" and
            .updateCommands.primary == "docker pull ghcr.io/promptfoo/promptfoo:latest"
          '
          curl -fsS http://localhost:3001/api/version | jq -e '
            .commandType == "npm" and
            .updateCommands.primary == "" and
            .updateCommands.isCustomContainer == true
          '

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669)
      - name: Upgrade npm
        run: npm install -g npm@11.11.0 --registry=https://registry.npmjs.org/

      - name: run promptfoo eval
        id: eval
        env:
          PROMPTFOO_REMOTE_API_BASE_URL: http://localhost:3000
          PROMPTFOO_SHARING_APP_BASE_URL: http://localhost:3000
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm run local -- eval -c .github/assets/promptfooconfig.yaml --share

      - name: Test that the eval results are uploaded
        run: |
          response=$(curl -s http://localhost:3000/api/results)
          echo "Response: $response"

          # Use jq to extract the array length
          count=$(echo "$response" | jq '.data | length')
          echo "Array Length: $count"

          # Check if the count is exactly 1
          if [ "$count" -ne 1 ]; then
            echo "Error: Expected 1 entry, but got $count"
            exit 1
          fi

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f promptfoo-container promptfoo-custom-container || true

      - name: Clean up Docker images
        if: always()
        run: |
          docker system prune -af
          docker volume prune -f
          df -h

  build-docker-and-push-digests:
    if: (github.event_name != 'pull_request')
    strategy:
      matrix:
        platforms:
          [{ runner: ubuntu-latest, arch: amd64 }, { runner: ubuntu-24.04-arm, arch: arm64 }]
    runs-on: ${{ matrix.platforms.runner }}
    timeout-minutes: 60
    needs: [test]
    outputs:
      amd64_digest: ${{ steps.digest.outputs.amd64 }}
      arm64_digest: ${{ steps.digest.outputs.arm64 }}
    permissions:
      contents: read
      packages: write
    steps:
      - *validate-release-tag

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.test.outputs.source_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - *set-up-docker-buildx

      - &log-in-to-the-container-registry
        name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-${{ matrix.platforms.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-${{ matrix.platforms.arch }},mode=max
          context: .
          platforms: linux/${{ matrix.platforms.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.created=${{ needs.test.outputs.created }}
            org.opencontainers.image.revision=${{ needs.test.outputs.source_sha }}
            org.opencontainers.image.licenses=${{ needs.test.outputs.license }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ needs.test.outputs.source_sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=${{ github.repository == 'promptfoo/promptfoo' && '1' || '0' }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: |
            type=image,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=promptfoo is a tool for testing evaluating and red-teaming LLM apps.

      # Matrix outputs have distinct names so a retry can reuse both successful builds.
      - name: Record platform digest
        id: digest
        env:
          ARCH: ${{ matrix.platforms.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"

  merge-docker-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, build-docker-and-push-digests]
    permissions:
      packages: write
    outputs:
      manifest_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - *log-in-to-the-container-registry

      - *set-up-docker-buildx

      - name: Create manifest list and push
        id: publish
        env:
          IMAGE_TAGS: ${{ needs.test.outputs.tags }}
          AMD64_DIGEST: ${{ needs.build-docker-and-push-digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.build-docker-and-push-digests.outputs.arm64_digest }}
        run: |
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid platform digest"
              exit 1
            fi
          done
          if [[ -z "$IMAGE_TAGS" || "$AMD64_DIGEST" == "$ARM64_DIGEST" ]]; then
            echo "::error::Expected publication tags and two distinct platform digests"
            exit 1
          fi
          image="$REGISTRY/$(tr '[:upper:]' '[:lower:]' <<< "$IMAGE_NAME")"
          read -ra tags <<< "$IMAGE_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$image:$tag")
          done
          metadata="$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create "${tag_args[@]}" --metadata-file "$metadata" \
            "$image@$AMD64_DIGEST" "$image@$ARM64_DIGEST"
          digest=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${tags[*]} at $digest"

  attest-docker-image:
    name: 'Attest Multi-arch Image'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [merge-docker-digests]
    permissions:
      id-token: write
      attestations: write
      packages: write

    steps:
      - *log-in-to-the-container-registry

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'
          subject-digest: '${{ needs.merge-docker-digests.outputs.manifest_digest }}'
          push-to-registry: true
