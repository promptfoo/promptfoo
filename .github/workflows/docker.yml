# This GitHub Action builds the Docker image Promptfoo,
# runs the Docker container, performs a health check to ensure the application
# is running correctly, and then publishes the image to GitHub Container Registry
# if all checks pass. This action is triggered by the release-please workflow,
# published human-created releases, workflow dispatch, pull requests that
# modify the Docker/runtime update contract, and matching pushes to main.

name: Test and Publish Multi-arch Docker Image
run-name: |
  ${{ (inputs.tag_name || github.event.release.tag_name) && 'Release' ||
      github.event_name == 'workflow_dispatch' && 'Manual' ||
      github.event_name == 'pull_request' && 'PR' ||
      'Push' }}
  Docker build for ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  ${{ github.event_name == 'pull_request' && format('(PR #{0})', github.event.number) || '' }}
  by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'The release tag name (e.g., 0.120.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag to publish (e.g., 0.121.6)'
        required: false
        type: string
      legacy_backfill:
        description: 'Build and validate a historical Docker image from its tag'
        required: false
        default: false
        type: boolean
      publish_legacy_image:
        description: 'Also publish the missing version tag after the current final-image checks pass'
        required: false
        default: false
        type: boolean
      python_version:
        description: 'Optional Python minor required by the tagged Alpine image (e.g., 3.14)'
        required: false
        type: string
      exclude_legacy_frontend_tests:
        description: 'Exclude historical frontend test files from production compilation'
        required: false
        default: false
        type: boolean
  release:
    types:
      - published
  pull_request:
    # Include stacked PRs so their final images receive the same runtime checks.
    paths: &runtime-paths
      - '.github/workflows/docker.yml'
      - '.github/scripts/prepareLegacyDockerBuild.cjs'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/testDockerImage.js'
      - 'src/envars.ts'
      - 'src/server/routes/version*.ts'
      - 'src/types/api/version.ts'
      - 'src/updates.ts'
      - 'src/updates/**'
  push:
    branches:
      - main
    paths: *runtime-paths

concurrency:
  # Reusable workflow calls inherit the caller's github.workflow value. Keep this
  # group Docker-specific so release-please callers are not cancelled mid-release.
  # Read-only historical validation must not displace a queued release. Writers share the publishing group.
  group: >-
    ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.ref) ||
        github.event_name == 'workflow_dispatch' && inputs.legacy_backfill && !inputs.publish_legacy_image && format('docker-validate-{0}', github.run_id) ||
        format('docker-publish-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || '' }}
  # Qualify tags so a same-named branch cannot change the release source.
  SOURCE_REF: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
  BUILD_VERSION: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  BUILD_DATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.updated_at || github.event_name == 'release' && github.event.release.published_at || github.event.head_commit.timestamp || github.event.repository.updated_at }}
  LEGACY_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_backfill && 'true' || 'false' }}
  # Only validation-only historical runs may skip the current container contract.
  RUN_CURRENT_IMAGE_CHECKS: ${{ (github.event_name != 'workflow_dispatch' || !inputs.legacy_backfill || inputs.publish_legacy_image) && 'true' || 'false' }}
  PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '' }}
  EXCLUDE_LEGACY_FRONTEND_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.exclude_legacy_frontend_tests && 'true' || 'false' }}
  # Fallback release paths build a specific tag outside release-please.yml.
  IS_RELEASE_FALLBACK: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') || github.event_name == 'release' }}

permissions: &read-only-permissions
  contents: read

jobs:
  test:
    # Bot-authored releases are already handled by release-please.yml after npm publish.
    # The release event path is for human-published fallback releases and backfills.
    if: github.event_name != 'release' || github.event.release.author.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: *read-only-permissions
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - &validate-release-tag
        name: Validate release tag
        if: github.event_name == 'release' || env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::RELEASE_TAG '$RELEASE_TAG' is empty or invalid"
            exit 1
          fi

      - name: Validate manual backfill options
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_LEGACY_IMAGE: ${{ inputs.publish_legacy_image }}
          FROM_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [[ "$PUBLISH_LEGACY_IMAGE" == 'true' && "$LEGACY_BACKFILL" != 'true' ]]; then
            echo '::error::Historical publication requires legacy backfill mode'
            exit 1
          fi
          if [[ "$PUBLISH_LEGACY_IMAGE" == 'true' && "$FROM_DEFAULT_BRANCH" != 'true' ]]; then
            echo '::error::Start historical publication from the default branch to run the current checks'
            exit 1
          fi
          if [[ "$LEGACY_BACKFILL" == 'true' && -z "$RELEASE_TAG" ]]; then
            echo '::error::Legacy backfills require a release tag'
            exit 1
          fi

          if [[ "$EXCLUDE_LEGACY_FRONTEND_TESTS" == 'true' && "$LEGACY_BACKFILL" != 'true' ]]; then
            echo '::error::Historical frontend test exclusions require legacy backfill mode'
            exit 1
          fi

          # Build overrides apply only to historical backfills.
          if [[ -n "$PYTHON_VERSION" && "$LEGACY_BACKFILL" != 'true' ]]; then
            echo '::error::Python minor overrides require legacy backfill mode'
            exit 1
          fi

          if [[ -n "$PYTHON_VERSION" && ! "$PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PYTHON_VERSION '$PYTHON_VERSION' must be a major.minor version"
            exit 1
          fi

      # Backfills must not replace images already published under a version tag.
      - name: Ensure the legacy tag is not already published
        if: env.LEGACY_BACKFILL == 'true' && inputs.publish_legacy_image
        run: |
          token="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}:pull&service=${REGISTRY}" | jq -r '.token // empty')"
          if [[ -z "$token" ]]; then
            echo "::error::Could not obtain a ${REGISTRY} pull token for ${IMAGE_NAME}"
            exit 1
          fi

          http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${RELEASE_TAG}")"

          case "$http_code" in
            404)
              echo "No image published for ${RELEASE_TAG}; safe to backfill"
              ;;
            200)
              echo "::error::${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG} is already published. Backfills fill gaps; they must never repoint a distributed tag."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${http_code} while checking whether ${RELEASE_TAG} is already published"
              exit 1
              ;;
          esac

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - &checkout-backfill-tools
        name: Check out the tools from the workflow revision
        if: env.LEGACY_BACKFILL == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/prepareLegacyDockerBuild.cjs
            /scripts/testDockerImage.js

      - &stage-backfill-tools
        name: Preserve the backfill tools before checking out the historical tag
        if: env.LEGACY_BACKFILL == 'true'
        run: cp -- .github/scripts/prepareLegacyDockerBuild.cjs scripts/testDockerImage.js "$RUNNER_TEMP/"

      - &checkout-source
        name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      # github.sha is the trigger SHA; SOURCE_REF can point checkout at a different tag.
      - &resolve-source-commit
        name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - &prepare-backfill
        name: Prepare historical Docker image build
        if: env.LEGACY_BACKFILL == 'true'
        run: node "$RUNNER_TEMP/prepareLegacyDockerBuild.cjs"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - &set-up-docker-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build official Docker image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-amd64
          context: .
          push: false
          load: true
          tags: local-test-image:official
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=1
            ${{ env.PYTHON_VERSION && format('PYTHON_VERSION={0}', env.PYTHON_VERSION) || '' }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build custom Docker image for contract testing
        if: env.RUN_CURRENT_IMAGE_CHECKS == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-linux-amd64
          context: .
          push: false
          load: true
          tags: local-test-image:custom
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=0
            ${{ env.PYTHON_VERSION && format('PYTHON_VERSION={0}', env.PYTHON_VERSION) || '' }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test final-image runtime dependencies
        if: env.RUN_CURRENT_IMAGE_CHECKS == 'true'
        run: |
          probe=scripts/testDockerImage.js
          if [[ "$LEGACY_BACKFILL" == true ]]; then probe="$RUNNER_TEMP/testDockerImage.js"; fi
          docker run --rm --network none -i \
            -e PROMPTFOO_TEST_PRODUCTION_DEPS=1 \
            local-test-image:official node --input-type=module < "$probe"

      # The registry cache replays the base stage, so only the final-stage upgrade is fresh.
      - name: Verify OS packages are current
        run: |
          # Fetch the indexes first: a simulated upgrade does not refresh them itself.
          plan="$(docker run --rm --user 0 local-test-image:official sh -c 'apk update --quiet && apk upgrade --simulate')"
          echo "$plan"
          if grep -q Upgrading <<< "$plan"; then
            echo "::error::The image is missing Alpine package upgrades"
            exit 1
          fi

      - name: Run Docker containers for testing
        run: |
          docker run -d --name promptfoo-container -p 3000:3000 local-test-image:official
          if [[ "$RUN_CURRENT_IMAGE_CHECKS" == 'true' ]]; then
            docker run -d --name promptfoo-custom-container -p 3001:3000 local-test-image:custom
          fi

      - name: Run health check
        run: |
          # Wait for both servers to be fully ready (including database migrations)
          # before running any CLI commands that also trigger migrations.
          ports=(3000)
          if [[ "$RUN_CURRENT_IMAGE_CHECKS" == 'true' ]]; then
            ports+=(3001)
          fi

          for port in "${ports[@]}"; do
            HEALTH_CHECK_PASS=
            for ((retry=1; retry<=10; retry++)); do
              if curl -f "http://localhost:${port}/health"; then
                echo -e "\nHealth check passed on port ${port}"
                HEALTH_CHECK_PASS=true
                break
              else
                echo "Health check on port ${port} failed, retrying in 2 seconds..."
                sleep 2
              fi
            done

            if [ -z "$HEALTH_CHECK_PASS" ]; then
              echo -e "\nHealth check on port ${port} failed after multiple attempts" >&2
              exit 1
            fi
          done

      - name: Verify Python and promptfoo
        run: |
          echo "Checking Python version:"
          if ! docker exec promptfoo-container python --version; then
            echo "Python check failed"
            exit 1
          fi

          echo "Checking promptfoo version:"
          if ! promptfoo_output="$(docker exec promptfoo-container promptfoo --version)"; then
            echo "promptfoo check failed"
            exit 1
          fi
          echo "$promptfoo_output"

          # Startup notices can precede the version; match the tag on a whole line.
          if [[ -n "$RELEASE_TAG" ]] && ! grep -Fxq "$RELEASE_TAG" <<< "$promptfoo_output"; then
            echo "::error::CLI version output does not report release '$RELEASE_TAG'"
            exit 1
          fi

          # Verify both CLI links on every image.
          echo "Checking pf alias:"
          if ! docker exec promptfoo-container pf --version; then
            echo "pf alias check failed"
            exit 1
          fi

          if [[ "$RUN_CURRENT_IMAGE_CHECKS" != 'true' ]]; then
            echo 'Validation-only historical build completed its release-era checks'
            exit 0
          fi

          echo "Checking container update markers and API guidance:"
          test "$(docker exec promptfoo-container printenv PROMPTFOO_RUNNING_IN_DOCKER)" = "1"
          test "$(docker exec promptfoo-container printenv PROMPTFOO_OFFICIAL_DOCKER_IMAGE)" = "1"
          test "$(docker exec promptfoo-custom-container printenv PROMPTFOO_RUNNING_IN_DOCKER)" = "1"
          test "$(docker exec promptfoo-custom-container printenv PROMPTFOO_OFFICIAL_DOCKER_IMAGE)" = "0"

          curl -fsS http://localhost:3000/api/version | jq -e '
            .commandType == "docker" and
            .updateCommands.primary == "docker pull ghcr.io/promptfoo/promptfoo:latest"
          '
          curl -fsS http://localhost:3001/api/version | jq -e '
            .commandType == "npm" and
            .updateCommands.primary == "" and
            .updateCommands.isCustomContainer == true
          '

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Node 24 ships with npm 11.6.2 which has a lockfile compatibility bug (npm/cli#8669)
      - name: Upgrade npm
        run: npm install -g npm@11.11.0 --registry=https://registry.npmjs.org/

      - name: run promptfoo eval
        id: eval
        env:
          PROMPTFOO_REMOTE_API_BASE_URL: http://localhost:3000
          PROMPTFOO_SHARING_APP_BASE_URL: http://localhost:3000
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm run local -- eval -c .github/assets/promptfooconfig.yaml --share

      - name: Test that the eval results are uploaded
        run: |
          response=$(curl -s http://localhost:3000/api/results)
          echo "Response: $response"

          # Use jq to extract the array length
          count=$(echo "$response" | jq '.data | length')
          echo "Array Length: $count"

          # Check if the count is exactly 1
          if [ "$count" -ne 1 ]; then
            echo "Error: Expected 1 entry, but got $count"
            exit 1
          fi

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f promptfoo-container promptfoo-custom-container || true

      - name: Clean up Docker images
        if: always()
        run: |
          docker system prune -af
          docker volume prune -f
          df -h

  build-docker-and-push-digests:
    if: github.event_name != 'pull_request' && (!inputs.legacy_backfill || inputs.publish_legacy_image)
    strategy:
      matrix:
        platforms:
          [
            { runner: ubuntu-latest, platform: linux/amd64, digest-suffix: linux-amd64 },
            { runner: ubuntu-24.04-arm, platform: linux/arm64, digest-suffix: linux-arm64 },
          ]
    runs-on: ${{ matrix.platforms.runner }}
    timeout-minutes: 60
    needs: [test]
    # A tag can move while the test job runs. Build every digest from the commit it tested.
    env:
      SOURCE_REF: ${{ needs.test.outputs.source_sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - *validate-release-tag

      - *checkout-backfill-tools
      - *stage-backfill-tools
      - *checkout-source

      # github.sha is the trigger SHA; SOURCE_REF can point checkout at a different tag.
      - *resolve-source-commit

      - *prepare-backfill

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - *set-up-docker-buildx

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - &log-in-to-the-container-registry
        name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.platforms.digest-suffix }}
          # Backfills may read the build cache but must not overwrite it.
          cache-to: ${{ env.LEGACY_BACKFILL != 'true' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.platforms.digest-suffix) || '' }}
          context: .
          platforms: ${{ matrix.platforms.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Record that the Dockerfile was patched and link the build run.
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ env.LEGACY_BACKFILL == 'true' && 'dev.promptfoo.image.backfilled=true' || '' }}
            ${{ env.LEGACY_BACKFILL == 'true' && format('dev.promptfoo.image.backfill-run={0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || '' }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PROMPTFOO_OFFICIAL_DOCKER_IMAGE=${{ github.repository == 'promptfoo/promptfoo' && '1' || '0' }}
            ${{ env.PYTHON_VERSION && format('PYTHON_VERSION={0}', env.PYTHON_VERSION) || '' }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: |
            type=image,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=promptfoo is a tool for testing evaluating and red-teaming LLM apps.

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.platforms.digest-suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-docker-and-push-digests]
    permissions:
      packages: write
    outputs:
      manifest_digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - *log-in-to-the-container-registry

      - *set-up-docker-buildx

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Fallback release builds publish immutable version tags only so moving aliases stay on normal release paths.
          tags: |
            type=ref,event=branch,enable=${{ env.IS_RELEASE_FALLBACK != 'true' }}
            type=ref,event=pr,enable=${{ env.IS_RELEASE_FALLBACK != 'true' }}
            type=semver,pattern={{version}},enable=${{ env.LEGACY_BACKFILL != 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.IS_RELEASE_FALLBACK != 'true' }}
            type=sha,enable=${{ env.IS_RELEASE_FALLBACK != 'true' }}
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && env.IS_RELEASE_FALLBACK != 'true' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          if [[ "$LEGACY_BACKFILL" == 'true' ]]; then
            token="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}:pull&service=${REGISTRY}" | jq -r '.token // empty')"
            http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${RELEASE_TAG}")"
            case "$http_code" in
              404) ;;
              200)
                echo "::error::${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG} was published after validation; refusing to repoint it."
                exit 1
                ;;
              *)
                echo "::error::Unexpected HTTP ${http_code} while rechecking ${RELEASE_TAG}"
                exit 1
                ;;
            esac
          fi

          # shellcheck disable=SC2046,SC2091
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        env:
          IMAGE_TAG: ${{ env.RELEASE_TAG || steps.meta.outputs.version }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          # Log full inspection details and extract digest
          INSPECT_OUTPUT=$(docker buildx imagetools inspect "${IMAGE_REF}")
          echo "$INSPECT_OUTPUT"
          # Extract the manifest digest (first Digest: line)
          DIGEST=$(echo "$INSPECT_OUTPUT" | grep -m1 "^Digest:" | awk '{print $2}')
          if [ -z "$DIGEST" ]; then
            echo "Error: Failed to extract manifest digest from inspect output"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: $DIGEST"

  attest-docker-image:
    name: 'Attest Multi-arch Image'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [merge-docker-digests]
    permissions:
      id-token: write
      attestations: write
      packages: write

    steps:
      - *log-in-to-the-container-registry

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'
          subject-digest: '${{ needs.merge-docker-digests.outputs.manifest_digest }}'
          push-to-registry: true
