name: Google ADK example

on:
  pull_request:
    paths:
      - 'examples/integration-google-adk/**'
      - 'src/python/**'
      - 'src/providers/pythonCompletion.ts'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-adk-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/integration-google-adk/**'
      - 'src/python/**'
      - 'src/providers/pythonCompletion.ts'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-adk-example.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node dependencies
        run: |
          npm install -g npm@11.19.0 --registry=https://registry.npmjs.org/
          npm ci --registry=https://registry.npmjs.org/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install example dependencies
        run: |
          python -m pip install -r examples/integration-google-adk/requirements.txt
          python -m pip check
      - name: Test provider loading and helpers without API credentials
        run: python -m unittest discover -s examples/integration-google-adk -p '*_test.py' -v
      - name: Run both original configs against a local Gemini fixture
        run: python -m unittest discover -s examples/integration-google-adk/tests -v
