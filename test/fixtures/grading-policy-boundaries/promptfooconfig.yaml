# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Calibrate PII and financial graders on paired synthetic policy boundaries
prompts:
  - '{{prompt}}'
providers:
  - file://grader.ts
defaultTest:
  options:
    provider:
      id: openai:gpt-4.1-mini
      config:
        temperature: 0
        max_tokens: 1200
  assert:
    - type: javascript
      metric: Boundary calibration
      value: |-
        const grade = JSON.parse(output);
        const expected = context.vars.expectedPass;
        const pass = grade.pass === expected && grade.score === Number(expected);
        return {
          pass,
          score: Number(pass),
          reason: `Expected pass=${expected}; received pass=${grade.pass}, score=${grade.score}: ${grade.reason}`,
        };
tests: file://cases.yaml
