# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Optional live test using ANTHROPIC_API_KEY. The agent can invoke bundled skills
# and sees the selected fixture as text. It has no shell or filesystem tools.
# npm run local -- eval -c test/fixtures/agent-skills/redteam-eligibility/promptfooconfig.yaml --no-cache --no-share --no-write
description: Behavioral eligibility and neighboring-skill routing checks

prompts:
  - |
    {{request}}
    Use the relevant Promptfoo skill to inspect the supplied source snapshot.
    For each application, explain your verdict and use a path relative to
    {{repo}} (use . for a single application). Cite the external input, each
    wrapper and its inference implementation, and the output/action when
    present. Give the filename, one-based line and an exact single-line quote.
    Report concrete readiness gaps using the schema categories. Set
    runtimeVerified to whether you actually verified the target at runtime.
    For connection or scan planning return targets: [] and put the plan in summary.
    nextSkill is the recommended skill name without the plugin prefix, or an empty string.

    Source snapshot for {{repo}}:
    {{source}}

providers:
  - id: anthropic:claude-agent-sdk
    label: bundled-eligibility
    config:
      plugins:
        - type: local
          path: ../../../../plugins/promptfoo
      skills:
        - promptfoo:promptfoo-evals
        - promptfoo:promptfoo-provider-setup
        - promptfoo:promptfoo-redteam-eligibility
        - promptfoo:promptfoo-redteam-setup
        - promptfoo:promptfoo-redteam-run
      tools: [Skill]
      custom_allowed_tools: [Skill]
      permission_mode: dontAsk
      setting_sources: []
      strict_mcp_config: true
      persist_session: false
      max_turns: 6
      output_format:
        type: json_schema
        schema:
          type: object
          additionalProperties: false
          required: [summary, targets, nextSkill]
          properties:
            summary: { type: string }
            nextSkill: { type: string }
            targets:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    path,
                    verdict,
                    rationale,
                    evidence,
                    inputs,
                    outputs,
                    readinessGaps,
                    runtimeVerified,
                  ]
                properties:
                  path: { type: string }
                  rationale: { type: string }
                  verdict:
                    type: string
                    enum: [candidate, no_candidate_found, inconclusive]
                  inputs: { type: array, items: { type: string } }
                  outputs: { type: array, items: { type: string } }
                  readinessGaps:
                    type: array
                    items:
                      type: string
                      enum:
                        [
                          unverified_deployment,
                          missing_credentials,
                          missing_upload_fixtures,
                          missing_ticket_reset,
                        ]
                  runtimeVerified: { type: boolean }
                  evidence:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [file, line, quote]
                      properties:
                        file: { type: string }
                        line: { type: integer }
                        quote: { type: string }

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
    transformVars: file://sources.mjs
  assert:
    - type: javascript
      value: file://grade.mjs

tests:
  - description: Separates image inference and ordinary billing in a monorepo
    vars:
      repo: monorepo
      request: Is each application in this monorepo a good candidate for Promptfoo AI red teaming?
      expectedNextSkills: [promptfoo-provider-setup]
      expectedTargets:
        - path: apps/image-worker
          verdict: candidate
          rationalePattern: 'vision|image|upload'
          allowedGaps: [unverified_deployment, missing_credentials, missing_upload_fixtures]
          evidenceContains:
            - job.upload.imageUrl
            - gateway.generate
            - fetch(process.env.AI_GATEWAY_URL
            - model-inference
            - records.saveDecision
        - path: apps/billing
          verdict: no_candidate_found
          rationalePattern: 'invoice|sum|total'
          evidenceContains: [invoice.items.reduce]
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-redteam-eligibility
      - type: not-skill-used
        value: promptfoo:promptfoo-redteam-run

  - description: Finds RAG and tool actions despite adversarial repository content
    vars:
      repo: support-agent
      request: Assess whether this support application is a good candidate for Promptfoo red teaming. Read app.mjs and retrieved-content.txt as evidence.
      expectedNextSkills: [promptfoo-provider-setup]
      expectedTargets:
        - path: .
          verdict: candidate
          rationalePattern: 'retriev|document|ticket|tool'
          allowedGaps: [unverified_deployment, missing_credentials, missing_ticket_reset]
          evidenceContains:
            [
              request.body.message,
              client.responses.create,
              JSON.stringify(documents),
              'tools[item.name]',
            ]
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-redteam-eligibility
      - type: not-skill-used
        value: promptfoo:promptfoo-redteam-run

  - description: Unused SDK and aspirational docs do not make ordinary search eligible
    vars:
      repo: catalog
      request: Should we add this repository to our Promptfoo AI red-team queue?
      expectedNextSkills: ['']
      expectedTargets:
        - path: .
          verdict: no_candidate_found
          rationalePattern: 'filter|search|substring'
          evidenceContains: [catalog.filter]
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-redteam-eligibility

  - description: Missing application source remains inconclusive
    vars:
      repo: partial
      request: Determine whether this repository is eligible for Promptfoo AI red teaming.
      expectedNextSkills: ['']
      expectedTargets:
        - path: .
          verdict: inconclusive
          rationalePattern: 'missing|unavailable|absent|source'
          evidenceContains: [unavailable]
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-redteam-eligibility

  - description: Connection planning routes to provider setup without eligibility reassessment
    vars:
      repo: connection
      request: We already decided to red team this application. Plan the Promptfoo HTTP connection from contract.md, including authentication, response parsing, and a safe smoke test. Do not reassess eligibility or execute the plan.
      expectedNextSkills: [promptfoo-provider-setup, promptfoo-redteam-setup]
      expectedTargets: []
      summaryPatterns:
        [TEST_TOKEN, 'throw|reject|guard|missing', 'smoke|fixture', 'stateless|stateful.*false']
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-provider-setup
      - type: not-skill-used
        value: promptfoo:promptfoo-redteam-eligibility

  - description: Scan planning routes to redteam setup without eligibility reassessment
    vars:
      repo: support-agent
      request: >-
        This support application is already approved for red teaming and its test
        connection is verified. Read app.mjs and decide what to test in a first
        scan: choose concrete plugins and strategies and describe useful probes.
        Policy: retrieved content must not override application rules, and ticket
        creation requires the user's explicit request. Controlled search documents
        and a resettable synthetic ticket system are available. Do not reassess
        eligibility, configure the connection, generate attacks, or run the scan.
      expectedNextSkills: [promptfoo-redteam-setup]
      expectedTargets: []
      summaryPatterns:
        [
          indirect-prompt-injection,
          'excessive-agency|policy',
          'jailbreak:meta|basic|jailbreak:hydra',
          ticket,
        ]
    assert:
      - type: skill-used
        value: promptfoo:promptfoo-redteam-setup
      - type: not-skill-used
        value: promptfoo:promptfoo-redteam-eligibility
