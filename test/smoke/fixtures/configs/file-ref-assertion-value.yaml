# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Test for #6253: file:// references in assertion values use script output
description: 'Regression test - file:// references in assertion values'

providers:
  - echo

prompts:
  - '{{expected}}'

tests:
  - description: uses JavaScript output as the assertion value
    vars:
      expected: DynamicValue
    assert:
      # The file:// reference should execute the script and use its return value
      - type: contains
        value: file://../assertions/dynamic-value.js

  - description: uses Python output as the assertion value
    vars:
      expected: PythonScriptValue
    assert:
      - type: contains
        value: file://../assertions/dynamic-value.py

  - description: uses Ruby output as the assertion value
    vars:
      expected: RubyScriptValue
    assert:
      - type: contains
        value: file://../assertions/dynamic-value.rb
